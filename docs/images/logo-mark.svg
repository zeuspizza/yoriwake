<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="yoriwake">
  <!-- Small mark for 16-64 px, redrawn rather than scaled from logo.svg.
       Transparent: every colour reaches 3:1 on both white and #0d1117. -->
  <defs>
    <radialGradient id="core" cx="0.42" cy="0.36" r="0.68">
      <stop offset="0" stop-color="#9bf5c9"/>
      <stop offset="0.5" stop-color="#2fc98c"/>
      <stop offset="1" stop-color="#1a9466"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fd894" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#2fd894" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2fd894" stop-opacity="0"/>
    </radialGradient>
    <!-- cuts the arm tops level, as in the full logo -->
    <clipPath id="tops"><rect x="0" y="17" width="64" height="47"/></clipPath>
  </defs>
  <!-- candidate tests -->
  <g fill="#6e737c">
    <circle cx="32" cy="4" r="3.1"/>
    <circle cx="22" cy="6.5" r="3.1"/>
    <circle cx="42" cy="6.5" r="3.1"/>
    <circle cx="13" cy="12" r="3.1"/>
    <circle cx="27" cy="13" r="3.1"/>
    <circle cx="37" cy="13" r="3.1"/>
    <circle cx="51" cy="12" r="3.1"/>
  </g>
  <!-- the Y/W filter -->
  <g clip-path="url(#tops)" fill="none" stroke="#8f949d" stroke-width="4" stroke-linejoin="miter">
    <path d="M7.5,15 L24,37 L24,49.5"/>
    <path d="M33.3,15 L21,33"/>
    <path d="M29.5,31 L32.5,35 L37.5,26 L42,33 L56.5,15"/>
  </g>
  <!-- the one test that has to run -->
  <circle cx="32" cy="57" r="7" fill="url(#halo)"/>
  <path d="M32,44 L32,53" stroke="#1fa372" stroke-width="3.6"/>
  <circle cx="32" cy="44" r="3.6" fill="#1fa372"/>
  <circle cx="32" cy="57" r="5" fill="url(#core)"/>
</svg>
