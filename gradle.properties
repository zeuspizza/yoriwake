# The agent jar is injected into a host build's test JVM, so the Kotlin stdlib must not be added
# to the runtime classpath of anything it bundles.
kotlin.stdlib.default.dependency=false

# File-system watching can miss an edit made just before a build and report compilation up to
# date, so a test runs against old bytes.
org.gradle.vfs.watch=false

# A dependency download that fails in transit is retried 5 times from a 2-second backoff, 30s in
# all, instead of 3 times a second apart: the default did not outlast a repository's rate limit.
# Internal properties; a Gradle that drops them falls back to its defaults.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=2000
