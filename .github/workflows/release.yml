name: release

# Publishes to the Gradle Plugin Portal from a version tag, and only from one. The Portal key lives in
# the `release` environment, which requires a maintainer's approval and accepts only `v*` tags, so a
# workflow on any other ref cannot reach it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The full build first, on a runner that never sees the key: the tests run code the key must not
  # share a machine with. A release is the one publish that cannot be taken back.
  verify:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      # Read-only, so the tests' code cannot write a cache the publish job restores.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: build and test
        run: ./gradlew build -PreleaseVersion="${GITHUB_REF_NAME#v}" --console=plain

  publish:
    name: publish to the Gradle Plugin Portal
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Pinned to commit SHAs rather than tags, because this job holds a secret. No token is left
      # in .git/config beside the key while Gradle runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      # Read-only, so nothing this job produced is restored into a later workflow.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      # The plugin-publish plugin reads these variables before any Gradle property, so the key
      # never appears on a command line.
      - name: publish
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :plugin:publishPlugins -PreleaseVersion="${GITHUB_REF_NAME#v}" --console=plain
