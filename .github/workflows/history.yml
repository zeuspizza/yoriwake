name: history

# Tests run and missed over consecutive real commits, on dispatch only: never on a pull request,
# whose code would run with this workflow's time and, in the merge job, its write access.
#
# Each project's window of first-parent commits is cut into shards of consecutive commits, one job
# each, sized to fit about five hours of a six-hour job (bench/history_replay.py plan). A shard
# records the map with a full run at its first commit's parent, then for each commit runs a
# selecting run against the map recorded at the parent and a recording full run at the commit,
# which is that commit's ground truth and its child's map (bench/history_replay.py). The merge job
# sums the shards into `history.json`, names any shard that left no file, writes the run page and
# attaches the file to a draft release for a maintainer to publish.
#
# `window` full walks each project's own window: the four Blastradius windows, as their project
# files name them, and the last 50 commits up to the pin of a corpus project. `window` latest walks
# the 20 most recent first-parent commits of each project's default branch. `isolated` names the
# Gradle projects that also walk a map recorded with a fresh test JVM per class.
#
# Dispatched in a release check on the gate commit, back to back with the sweep, never on a
# schedule.
on:
  workflow_dispatch:
    inputs:
      window:
        description: full walks each project's own window, latest the 20 newest commits
        type: choice
        options: [latest, full]
        default: latest
      projects:
        description: space-separated project files under bench/projects, without .toml
        type: string
        default: shenyu httpcomponents-client jsoup-history commons-io moshi resilience4j grpc-java
      isolated:
        description: space-separated Gradle projects that also walk an isolated map
        type: string
        default: ''

permissions:
  contents: read

# The build runs on Gradle 8.14, the supported floor, on purpose (CONTRIBUTING.md); turning off
# setup-gradle's build capture is the action's only way to drop its "out of date" notice.
env:
  GRADLE_ACTIONS_SKIP_BUILD_RESULT_CAPTURE: 'true'

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Its shards take many runners for hours; this names any open pull request whose checks
      # would wait behind them, and never stops the run: the rule is the dispatcher's.
      - name: no pull request waits behind the run
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -u
          for repo in "$OWNER/yoriwake" "$OWNER/yoriwake-action"; do
            if open=$(gh pr list --repo "$repo" --state open --json number,title --jq '.[] | "#\(.number) \(.title)"'); then
              while IFS= read -r line; do
                [ -n "$line" ] && echo "::warning::$repo $line is open: its checks wait behind this run"
              done <<< "$open"
            else
              echo "::warning::could not list the open pull requests of $repo"
            fi
          done
      - id: plan
        env:
          WINDOW: ${{ inputs.window }}
          PROJECTS: ${{ inputs.projects }}
          ISOLATED: ${{ inputs.isolated }}
        run: |
          set -eu
          read -ra projects <<< "$PROJECTS"
          read -ra isolated <<< "$ISOLATED"
          [ "${#projects[@]}" -gt 0 ] || { echo "name at least one project"; exit 1; }
          python3 bench/history_replay.py plan --window "$WINDOW" --projects "${projects[@]}" \
            --isolated "${isolated[@]+"${isolated[@]}"}" > plan.json
          jq -r '.[] | "\(.project) \(.shard)/\(.of): \(.args | join(" "))"' plan.json
          echo "shards=$(jq -c . plan.json)" >> "$GITHUB_OUTPUT"

  # The plugin under test, built and published once for every shard (bench/publish_once.py): each
  # building it drew Maven Central's rate limit on the plugin build's own dependencies. A failed
  # publish fails the run here, before any shard starts.
  publish:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          add-job-summary: on-failure
      - name: publish the plugin under test
        run: python3 bench/publish_once.py --out "$RUNNER_TEMP/plugin-under-test"
      # Every shard of this run restores it into its mavenLocal.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-under-test
          retention-days: 3
          path: ${{ runner.temp }}/plugin-under-test/
          if-no-files-found: error

  shard:
    needs: [plan, publish]
    name: ${{ matrix.entry.project }} ${{ matrix.entry.shard }}/${{ matrix.entry.of }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      # The stamp of the plugin restored below, checked instead of publishing it again.
      YORIWAKE_PUBLISHED: ~/.m2/repository/io/github/zeuspizza/published.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            11
            17
            25
            26
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          # A walked project's own failing tests fail builds here; the shard's file tells what failed.
          add-job-summary: never
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-under-test
          path: ~/.m2/repository/io/github/zeuspizza
      # Ends before the job does, so a shard that overruns still uploads the file it has written
      # after every commit.
      - name: walk the shard
        timeout-minutes: 350
        env:
          NAME: ${{ matrix.entry.project }}
          SHARD: ${{ matrix.entry.shard }}
          OF: ${{ matrix.entry.of }}
          ARGS: ${{ toJSON(matrix.entry.args) }}
        run: |
          set -eu
          # A guest's own test report on the run page is unlabelled; the merge job writes the page.
          unset GITHUB_STEP_SUMMARY
          bench/machine_sampler.sh & sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          mapfile -t args < <(jq -r '.[]' <<< "$ARGS")
          python3 bench/history_replay.py "bench/projects/$NAME.toml" "${args[@]}" --publish \
            --logs "$RUNNER_TEMP/logs" --out "out/history-$NAME-${SHARD}of$OF.json"
      # The merge job reads it; kept for re-running the merge.
      - if: ${{ !cancelled() && hashFiles('out/*.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.entry.project }}-${{ matrix.entry.shard }}
          path: out/
          retention-days: 30
          if-no-files-found: error
      # The runs' logs, for a maintainer reading why a commit was excluded or a test missed.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.entry.project }}-${{ matrix.entry.shard }}
          path: ${{ runner.temp }}/logs/
          retention-days: 14
          if-no-files-found: ignore

  merge:
    needs: [plan, shard]
    # Also when a shard failed: it is named missing, and the merge fails the run after publishing
    # the rest.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    # The only job that can write, and it runs no guest code.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: downloaded
      - name: merge, and attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.shards }}
          RUN: ${{ github.run_id }}
          WINDOW: ${{ inputs.window }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          status=0
          python3 bench/history_replay.py merge downloaded --plan "$PLAN" --out history.json || status=$?
          python3 bench/history_replay.py page history.json > history.md
          cat history.md >> "$GITHUB_STEP_SUMMARY"
          missing=$(jq -r '.missing | join("; ")' history.json)
          title="Tests run and missed over real commits ($WINDOW), run $RUN"
          [ "$status" = 0 ] || title="$title (PARTIAL)"
          gh release create "history-$RUN" --repo "$REPO" --draft --title "$title" \
            --notes "Consecutive real commits walked by run $RUN at $GITHUB_SHA. Missing: ${missing:-none}." \
            history.json history.md
          exit "$status"
      # The one download a reader needs, also of a run that ends red for a missing shard.
      - if: ${{ !cancelled() && hashFiles('history.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-results
          path: |
            history.json
            history.md
          retention-days: 90
          overwrite: true
