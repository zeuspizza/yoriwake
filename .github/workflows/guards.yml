name: guards

# Breaks each safety rule in turn and checks that a test catches it (scripts/prove_guards.py).
# Every pull request runs fast mode and the guards its change can affect, in any suite; one that
# changes the plugin's or agent's shipped sources runs every guard instead. Every guard also runs
# nightly, and on dispatch before a release. A guard that does not fire fails the job and names it.
#
# A scheduled workflow that sees no repository activity for 60 days is disabled by GitHub; the
# release checklist checks it is on.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

# A newer push to a pull request cancels its older run.
concurrency:
  group: guards-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Read-only, no secrets, and triggered by pull_request rather than pull_request_target, so the
# harness a pull request brings cannot reach anything.
permissions:
  contents: read

jobs:
  # Whether the change needs guards at all, and whether it reaches the shipped sources. Either
  # answer missing runs more, never less: a skipped job satisfies a required check.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
      product: ${{ steps.decide.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            echo "code=$(python3 .github/ci.py needs-checks "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"
            echo "product=$(python3 .github/ci.py touches-product "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "product=true" >> "$GITHUB_OUTPUT"
          fi

  fast:
    name: guards, fast and the change's own
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' && needs.changes.outputs.product != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: python3 scripts/prove_guards.py --mode fast
      # Every suite, narrowed to the guards whose target, tests or build files the change touched,
      # or whose entry it edits: a change to a suite fast mode leaves out is proved here.
      - name: the guards the change can affect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/prove_guards.py --mode full --changed "$(git merge-base "$BASE" HEAD)"

  full:
    name: guards, every one
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'pull_request' || needs.changes.outputs.product != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: python3 scripts/prove_guards.py --mode full

  report-failure:
    needs: [changes, full]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue create -R "$REPO" --title "Nightly guard run failed" --body "$URL"
