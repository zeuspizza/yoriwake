name: guards

# Breaks each safety rule in turn and checks that a test catches it (scripts/prove_guards.py).
# Every pull request runs fast mode and the guards its change can affect, in any suite; one that
# changes the shipped sources runs every guard instead. Every guard also runs on dispatch in each
# release check, never on a schedule. A guard that does not fire fails the job and names it.
#
# Each guard job runs in 8 shards of the selected guards, balanced by the costs CI measured
# (scripts/guard_costs.json) with a functional or Maven class's guards together (`--shard I/N`),
# and a check job under the job's required name: every shard succeeded, and every guard the check
# selects itself fired in exactly one shard (.github/guard_shards.py). Both checks also report
# each shard's projected and measured job and the margin to its limit (scripts/guard_costs.py
# report); the every-guard check uploads the cost table its run measured, and the release check
# commits it.
#
# A dispatch can run chosen every-guard shards again on a newer commit, after a red shard of a
# release check: `shards` names them and `reuse` the earlier dispatch, whose other shards stand
# when only documents no check reads or workflows changed since (.github/ci.py reuse-shards).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      shards:
        description: 'Every-guard shards to run, as 3,6; the others come from the run in reuse'
        required: false
        default: ''
      reuse:
        description: 'The id of an earlier dispatch of this workflow whose other shards stand'
        required: false
        default: ''

# A newer push to a pull request cancels its older run.
concurrency:
  group: guards-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Read-only, no secrets, and triggered by pull_request rather than pull_request_target, so the
# harness a pull request brings cannot reach anything.
permissions:
  contents: read

# The build runs on Gradle 8.14, the supported floor, on purpose (CONTRIBUTING.md); turning off
# setup-gradle's build capture is the action's only way to drop its "out of date" notice.
env:
  GRADLE_ACTIONS_SKIP_BUILD_RESULT_CAPTURE: 'true'

jobs:
  # Whether the change needs guards at all, and whether it reaches the shipped sources. Either
  # answer missing runs more, never less: a skipped job satisfies a required check. Also the base
  # every shard and check selects the change's guards from, so all of them select the same ones.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    # Reading another run's artifacts takes `actions: read`; nothing here writes.
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
      product: ${{ steps.decide.outputs.product }}
      base: ${{ steps.decide.outputs.base }}
      shards: ${{ steps.reuse.outputs.shards || '[1, 2, 3, 4, 5, 6, 7, 8]' }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            {
              echo "code=$(python3 .github/ci.py needs-checks "$BASE" "$HEAD")"
              echo "product=$(python3 .github/ci.py touches-product "$BASE" "$HEAD")"
              echo "base=$(git merge-base "$BASE" HEAD)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "product=true" >> "$GITHUB_OUTPUT"
          fi
      # Which every-guard shards a dispatch runs: those it names, when the earlier run's others
      # stand; else every one, and the summary says why. Inputs reach the script through the
      # environment, never spliced into it.
      # A failure or a hung call here leaves the output unset, and every shard runs.
      - id: reuse
        if: github.event_name == 'workflow_dispatch' && (inputs.shards != '' || inputs.reuse != '')
        continue-on-error: true
        timeout-minutes: 10
        env:
          SHARDS: ${{ inputs.shards }}
          REUSE: ${{ inputs.reuse }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          mkdir -p earlier reused
          path="" event="" head=""
          case "$REUSE" in
            ''|*[!0-9]*) ;;
            *)
              if found=$(gh api "repos/$REPO/actions/runs/$REUSE" --jq '[.path, .event, .head_sha] | @tsv'); then
                IFS=$'\t' read -r path event head <<< "$found"
              fi
              gh run download "$REUSE" --repo "$REPO" --pattern 'guards-every-*' --pattern guards-joined --dir earlier || true
              ;;
          esac
          python3 .github/ci.py reuse-shards earlier reused --run "$REUSE" --head "$head" --event "$event" \
            --workflow "$path" --shards "$SHARDS" --count 8 > shards.json 2> why.txt
          echo "shards=$(cat shards.json)" >> "$GITHUB_OUTPUT"
          if [ -n "$(ls reused)" ]; then echo "reused=true" >> "$GITHUB_OUTPUT"; fi
          cat why.txt >> "$GITHUB_STEP_SUMMARY"
      # The every-guard check joins them with this run's shards. Kept a week, as the shards' own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.reuse.outputs.reused == 'true'
        with:
          name: guards-reused
          path: reused/
          if-no-files-found: error
          retention-days: 7

  fast-shard:
    name: guards, fast and the change's own (shard ${{ matrix.shard }}/8)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' && needs.changes.outputs.product != 'true' }}
    runs-on: ubuntu-24.04
    # `--changed` selects every guard when a change edits all of them, and a change to the
    # functional tests selects every functional and Maven guard. The limit sits above the worst
    # shard's projection and the largest shortfall of a projection on a measured pull-request run:
    # `python3 scripts/guard_costs.py report <shards-dir> --job fast-shard` prints both for a run's
    # artifacts, and `prove_guards.py --shard I/N --changed --list-selection FILE` projects one.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # A guard that fires fails a build by design; the shard's results tell what failed.
          add-job-summary: never
      # The Maven suite's distributions, as in verify: fetched once and kept between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/yoriwake-maven-distributions
          key: maven-distributions-${{ hashFiles('maven/src/functionalTest/kotlin/io/github/zeuspizza/yoriwake/maven/FunctionalMaven.kt') }}
          restore-keys: maven-distributions-
      - run: |
          mkdir -p results
          python3 scripts/prove_guards.py --mode fast --shard ${{ matrix.shard }}/8 --results results/fast.json
      # Every suite, narrowed to the guards whose target, tests or build files the change touched,
      # or whose entry it edits: a change to a suite fast mode leaves out is proved here.
      - name: the guards the change can affect
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: python3 scripts/prove_guards.py --mode full --changed "${BASE:?no merge base}" --shard ${{ matrix.shard }}/8 --results results/changed.json
      # Always, and an error when empty: the check reads every shard's results.
      # Kept a day: a re-run after a day needs "Re-run all jobs".
      # A GitHub error on this upload would lose the shard's hours of work and keep the check
      # from running: it is tried twice, and the job fails only when the second try fails too.
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: guards-pr-${{ matrix.shard }}-of-8
          path: results/
          if-no-files-found: error
          retention-days: 1
      # The same upload, when the first failed: the check job reads it. The first may have left
      # the artifact half made, so this one overwrites it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.upload.outcome == 'failure'
        with:
          name: guards-pr-${{ matrix.shard }}-of-8
          path: results/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  # Named as the unsharded job was, and the check that is required: every shard succeeded and
  # every guard the check selects itself, the shards' flags but no shard, fired in exactly one.
  fast:
    name: guards, fast and the change's own
    needs: [changes, fast-shard]
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' && needs.changes.outputs.product != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: every shard succeeded
        if: needs.fast-shard.result != 'success'
        run: |
          echo "a shard of the pull request's guards did not succeed: ${{ needs.fast-shard.result }}"
          exit 1
      # Always, so a failed or timed-out shard's timings are still reported.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()
        with:
          fetch-depth: 0
      - id: shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          pattern: guards-pr-*
          path: shards
      - name: every selected guard fired in exactly one shard
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          set -u
          python3 scripts/prove_guards.py --mode fast --list-selection fast.json
          python3 scripts/prove_guards.py --mode full --changed "${BASE:?no merge base}" --list-selection changed.json
          status=0
          python3 .github/guard_shards.py check fast.json shards --count 8 --file fast.json || status=1
          python3 .github/guard_shards.py check changed.json shards --count 8 --file changed.json || status=1
          exit $status
      # Reporting only: a failure here must not decide the required check.
      - name: the shards' projected and measured job, and its margin to the limit
        if: always() && steps.shards.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/guard_costs.py report shards --file fast.json --file changed.json

  full-shard:
    name: guards, every one (shard ${{ matrix.shard }}/8)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'pull_request' || needs.changes.outputs.product != 'false') }}
    runs-on: ubuntu-24.04
    # The limit leaves room above the worst shard's projection and above how far a measured shard
    # has run over its own: `python3 scripts/guard_costs.py report <shards-dir> --job full-shard`
    # prints both for a run's artifacts. Release dry-run attempts have been cut at a lower limit on
    # slow runners whose Maven downloads timed out, and each new class the guards grow has pushed
    # the slowest shard toward it: raise it from that report, not from a duration written here.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Every shard, unless a dispatch keeps an earlier run's results for some.
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # A guard that fires fails a build by design; the shard's results tell what failed.
          add-job-summary: never
      # The Maven suite's distributions, as in verify: fetched once and kept between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/yoriwake-maven-distributions
          key: maven-distributions-${{ hashFiles('maven/src/functionalTest/kotlin/io/github/zeuspizza/yoriwake/maven/FunctionalMaven.kt') }}
          restore-keys: maven-distributions-
      # With the run and commit its guards ran at, for a later dispatch that takes this shard.
      - env:
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p results
          printf '{"run": %s, "head": "%s"}\n' "$RUN" "$SHA" > results/source.json
          python3 scripts/prove_guards.py --mode full --shard ${{ matrix.shard }}/8 --results results/full.json
      # The check job reads every shard's results. Kept a week: a dispatch that runs chosen shards
      # again takes the others from here.
      # A GitHub error on this upload would lose the shard's hours of work and keep the check
      # from running: it is tried twice, and the job fails only when the second try fails too.
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: guards-every-${{ matrix.shard }}-of-8
          path: results/
          if-no-files-found: error
          retention-days: 7
      # The same upload, when the first failed: the check job reads it. The first may have left
      # the artifact half made, so this one overwrites it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.upload.outcome == 'failure'
        with:
          name: guards-every-${{ matrix.shard }}-of-8
          path: results/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  full:
    name: guards, every one
    needs: [changes, full-shard]
    if: always() && needs.changes.outputs.code != 'false' && (github.event_name != 'pull_request' || needs.changes.outputs.product != 'false')
    runs-on: ubuntu-24.04
    steps:
      - name: every shard succeeded
        if: needs.full-shard.result != 'success'
        run: |
          echo "a shard of every guard did not succeed: ${{ needs.full-shard.result }}"
          exit 1
      # Always, so a failed or timed-out shard's timings are still reported and kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()
      - id: shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          pattern: guards-every-*
          path: shards
      # The shards this run kept from an earlier one, beside its own.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always() && needs.changes.outputs.reused == 'true'
        with:
          name: guards-reused
          path: shards
      - name: every guard fired in exactly one shard
        run: |
          python3 scripts/prove_guards.py --mode full --list-selection full.json
          python3 .github/guard_shards.py check full.json shards --count 8 --file full.json
      # Reporting only: a failure here or in the upload must not decide the required check.
      - name: the shards' projected and measured job, and the costs they measured
        if: always() && steps.shards.outcome == 'success'
        continue-on-error: true
        env:
          RUN: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          python3 scripts/guard_costs.py report shards
          python3 scripts/guard_costs.py derive shards --out guard-costs/guard_costs.json --run "$RUN" --commit "$SHA"
      # The release check reads it, to commit it as scripts/guard_costs.json. Kept a week: a pull
      # request's run stands in when the release check's own is missing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.shards.outcome == 'success'
        continue-on-error: true
        with:
          name: guard-costs
          path: guard-costs/
          if-no-files-found: error
          retention-days: 7
      # Every shard's results, this run's and those it kept, each with its run and commit: a later
      # dispatch takes shards from here, and the run summary names where each came from. Kept a
      # week, as the shards' own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.shards.outcome == 'success'
        continue-on-error: true
        with:
          name: guards-joined
          path: shards/
          if-no-files-found: error
          retention-days: 7

  # The run's one summary: each job's result, the guards each shard proved and what failed
  # (.github/run_summary.py). It reports and gates nothing, so no required check is on it.
  run-summary:
    name: run summary
    needs: [changes, fast-shard, fast, full-shard, full]
    if: always() && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: guards-*
          path: results
      # Through the environment, never spliced into the script.
      - name: write the run's summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/run_summary.py .github/workflows/guards.yml results
