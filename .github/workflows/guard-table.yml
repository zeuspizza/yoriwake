name: guard table

# The guard table itself: every anchor matches exactly once, and a pull request that removes a
# guard, re-aims one (its target, anchor, suite or expected test) or takes a suite out of the fast
# set fails, naming each. A maintainer approves such a change with the `weakens-guards` label,
# which only people with triage access can add; adding or removing it re-runs this check. Its own
# workflow, so a label re-runs this and not the guards. The label is read when the check runs, not
# from the event that started it, so re-running a failed check after the label is added passes, and
# one after it is removed fails.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  table:
    name: no guard weakened
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 scripts/test_prove_guards.py
      - run: python3 scripts/test_guard_costs.py
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          # Asked only when a guard is weakened, so an API failure can fail no other pull request.
          if python3 scripts/prove_guards.py --against "$BASE"; then
            exit 0
          elif gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name' | grep -qx weakens-guards; then
            echo "::notice::the weakened guards above are approved by the weakens-guards label"
          else
            exit 1
          fi
