name: sweep

# A benchmark sweep, on dispatch and weekly on `main`: never on a pull request, whose code would run
# with this workflow's time and, in the merge job, its write access.
#
# Each project records in one job (capture, baseline, preflight, the compile gate over its draw
# order), which fixes its accepted target list and cuts it into slices. Each slice is one job that
# runs both arms of its rows, so a row's two times come from one machine; it starts when its own
# project's record job ends (sweep-project.yml). The merge job folds the slices back into the file
# one job would have written (bench/merge.py) and attaches the results, with the maps and decision
# records, to a draft release for a maintainer to publish. It also writes the run page, one section
# per project (bench/sweep_page.py), and uploads the merged results as the `sweep-results` artifact.
#
# What runs follows from what changed since `base` (bench/tier.py) unless `tier` names it: nothing,
# an offline replay of the last published sweep's rows, the reduced arm, or every project. A full
# sweep covers the projects `only` names: `demo` unless told otherwise, `all` for every project. A
# dispatch that leaves `only` empty gets its default, `demo`; only a run with no inputs at all (a
# schedule) sees it empty, and sweeps every project.
#
# A full sweep that lacked some projects is completed by a dispatch that re-runs them, with
# `completes` naming its run: the draft release then holds both runs' projects as one sweep. It is
# refused before measuring unless the selector's sources are the earlier run's, and the merge
# refuses rows measured under another selector or grammar (bench/merge.py --completes).
#
# Dispatched in each release check on the candidate, never on a schedule: a full sweep of every
# project takes about 7.5 to 10 hours.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: auto decides from the change since base
        type: choice
        options: [auto, replay, reduced, full, control]
        default: auto
      base:
        description: the commit the last published figures describe (empty is the latest v* tag)
        type: string
        default: ''
      major_release:
        description: this is a major release, which sweeps everything
        type: boolean
        default: false
      only:
        description: space-separated projects to restrict a full sweep to, or all for every project
        type: string
        default: demo
      # Measured on the demo: a runner's selected arm took a median 1.38 times, and its compile gate
      # 1.5 times, what the same rows took on the machine that measured the last local times.
      factor:
        description: runner seconds per local second, measured on the demo
        type: string
        default: '1.5'
      completes:
        description: the run id of an earlier full sweep, some of whose missing projects only re-runs
        type: string
        default: ''

permissions:
  contents: read

# The build runs on Gradle 8.14, the supported floor, on purpose (CONTRIBUTING.md); turning off
# setup-gradle's build capture is the action's only way to drop its "out of date" notice.
env:
  GRADLE_ACTIONS_SKIP_BUILD_RESULT_CAPTURE: 'true'

jobs:
  plan:
    runs-on: ubuntu-24.04
    # Reads the head commit of the run a completion names.
    permissions:
      contents: read
      actions: read
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          TIER: ${{ inputs.tier }}
          BASE: ${{ inputs.base }}
          MAJOR: ${{ inputs.major_release }}
          ONLY: ${{ inputs.only }}
          COMPLETES: ${{ inputs.completes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A scheduled run has no inputs; it sweeps the full arm. A dispatch always carries a tier.
          TIER=${TIER:-full}
          # Refused here rather than after hours of measuring: a completion's rows join the earlier
          # run's only if both measured the same selector.
          if [ -n "$COMPLETES" ]; then
            case $COMPLETES in
              *[!0-9]*) echo "completes takes a run id, not '$COMPLETES'"; exit 1 ;;
            esac
            [ "$TIER" = full ] || { echo "a completion is a full sweep, not tier $TIER"; exit 1; }
            if [ -z "$ONLY" ] || [ "$ONLY" = all ]; then
              echo "a completion re-runs the projects only names, not '$ONLY'"; exit 1
            fi
            read -r workflow sha < <(gh run view "$COMPLETES" --json workflowName,headSha --jq '"\(.workflowName) \(.headSha)"')
            [ "$workflow" = sweep ] || { echo "run $COMPLETES is a '$workflow' run, not a sweep"; exit 1; }
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "run $COMPLETES ran '$sha', which this checkout cannot reach"; exit 1
            fi
            # Both sides, not tier.py's three-dot diff: a change on the earlier run's branch alone
            # moves the selector as much as one here.
            mapfile -t changed < <(git diff --name-only "$sha" HEAD)
            moved=$(python3 -c 'import sys, bench.tier as t; print(*t.decide(sys.argv[1:])["selector_paths"])' \
              "${changed[@]+"${changed[@]}"}")
            if [ -n "$moved" ]; then
              echo "the selector's sources moved since run $COMPLETES ($sha): $moved"; exit 1
            fi
            # The mutation grammar too: the merge refuses two grammars, and only after the hours.
            # Every set's grammar files, since which set a project draws from is not known here.
            redrawn=$(python3 -c 'import sys; sys.path.insert(0, "bench"); import run
          grammar = set(run.GRAMMAR_SOURCE_FILES) | set(run.REVERT_GRAMMAR_FILES)
          grammar |= {f for files in run.SET_GRAMMAR_FILES.values() for f in files}
          print(*sorted(grammar & set(sys.argv[1:])))' "${changed[@]+"${changed[@]}"}")
            if [ -n "$redrawn" ]; then
              echo "the mutation grammar moved since run $COMPLETES ($sha): $redrawn"; exit 1
            fi
          fi
          if [ "$TIER" = auto ]; then
            base=${BASE:-$(git describe --tags --abbrev=0 --match 'v*')}
            major=()
            [ "$MAJOR" = true ] && major=(--major-release)
            TIER=$(python3 bench/tier.py "$base" HEAD "${major[@]}" | jq -r .tier)
          fi
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          projects='[]'
          if [ "$TIER" = reduced ] || [ "$TIER" = full ]; then
            only=()
            # The reduced arm names its own projects and refuses --only.
            [ -n "$ONLY" ] && [ "$ONLY" != all ] && [ "$TIER" = full ] && only=(--only $ONLY)
            projects=$(python3 bench/sweep_corpus.py --arm "$TIER" "${only[@]}" --print-commands)
          fi
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "tier: $TIER"
      - name: fetch the rows the last published sweep measured
        if: steps.plan.outputs.projects != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Each project's slices are priced from them (bench/shard.py): runners measured them. Once
          # here, not in every record job: the release also holds every row's evidence.
          # Pricing only: without them each record job prices from its own header, so a failed
          # fetch costs slice sizes, never the sweep.
          mkdir -p published-rows
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
                  --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("sweep-"))][0] // ""') \
            || { echo "::warning::could not list releases; slices are priced from each record job"; tag=""; }
          if [ -n "$tag" ] && ! {
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'sweep-*.tar.gz' \
              --dir "$RUNNER_TEMP/published" &&
            tar -xzf "$RUNNER_TEMP/published/$tag.tar.gz" -C "$RUNNER_TEMP/published" merged &&
            find "$RUNNER_TEMP/published/merged" -maxdepth 1 -name '*.json' ! -name sweep.json \
              -exec cp {} published-rows/ \;
          }; then
            echo "::warning::could not read $tag; slices are priced from each record job"
            rm -f published-rows/*.json
            tag=""
          fi
          echo "${tag:-none}" > published-rows/source.txt
          echo "rows priced from: ${tag:-no published sweep}"
      # Each record job reads it before cutting its project into slices; it outlives the records.
      - if: steps.plan.outputs.projects != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-rows
          retention-days: 3
          path: published-rows/

  # The positive control: a plugin built with a planted miss, swept on the fixtures. It fails unless
  # every fixture reports the miss, so a harness that lost the ability to see one cannot pass.
  control:
    needs: plan
    if: needs.plan.outputs.tier == 'control'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          add-job-summary: on-failure
      - name: sweep the controls
        run: |
          # As in the record and shard steps: no guest build writes to the run page.
          unset GITHUB_STEP_SUMMARY
          python3 bench/controls.py

  # Selection logic alone: the last published sweep's rows re-asked of this selector, offline. A
  # pass or a fail, never new figures.
  replay:
    needs: plan
    if: needs.plan.outputs.tier == 'replay'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          add-job-summary: on-failure
      - name: replay the last published sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ./gradlew :agent:jar --console=plain
          tag=$(gh release list --json tagName,isDraft \
                  --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("sweep-"))][0]')
          [ -n "$tag" ] || { echo "no published sweep to replay"; exit 1; }
          gh release download "$tag" --pattern 'sweep-*.tar.gz' --dir published
          tar -xzf published/sweep-*.tar.gz -C published
          mkdir -p bench/results bench/logs
          cp published/merged/*.json bench/results/
          rm -f bench/results/sweep.json
          for kept in published/evidence/*.tar.gz; do tar -xzf "$kept" -C bench/logs; done
          python3 bench/replay_decisions.py

  # Each project's record job and its slices, in a workflow of their own: a project's slices start
  # when its own record job ends, not when the slowest project's does.
  project:
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    # A guest may resolve dependencies from GitHub Packages (bitwarden-android's SDK); a called
    # workflow can only narrow what this grants.
    permissions:
      contents: read
      packages: read
    strategy:
      # The merge refuses a reduced arm short of a member, so one failed member stops the others'
      # slices; on the full arm one failed project must not cost the others their rows.
      fail-fast: ${{ needs.plan.outputs.tier == 'reduced' }}
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    uses: ./.github/workflows/sweep-project.yml
    with:
      project: ${{ toJSON(matrix.project) }}
      factor: ${{ inputs.factor }}

  merge:
    needs: [plan, project]
    # Also when a project's record or shard job failed: it is declared missing, and the merge fails
    # the run after publishing the rest. Not on a run that planned no project.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.projects != '[]' }}
    runs-on: ubuntu-24.04
    # The only job that can write, and it runs no guest code.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded
      - name: merge, and attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.projects }}
          ARM: ${{ needs.plan.outputs.tier }}
          RUN: ${{ github.run_id }}
          COMPLETES: ${{ inputs.completes }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          names=$(jq -r '.[].project' <<< "$PLAN")
          declared=()
          mkdir -p evidence
          for name in $names; do
            # Read from the artifacts: a matrix of called workflows hands no per-project output back.
            list=""
            if [ -d "downloaded/record-$name" ]; then
              list=$(find "downloaded/record-$name" -path "*/$name/accepted.json" -print -quit)
            fi
            if [ -z "$list" ]; then
              echo "::warning::$name: no accepted list; its record job failed"
              declared+=("$name=its record job failed")
              continue
            fi
            record=$(dirname "$list")
            of=$(jq '.slices | length' "$record/accepted.json")
            if [ "$of" -lt 1 ]; then
              echo "::warning::$name was cut into no slices"
              declared+=("$name=it was cut into no slices")
              continue
            fi
            # Every shard or none: a project with a shard missing is declared, not merged short.
            lost=""
            for k in $(seq 1 "$of"); do
              [ -f "downloaded/shard-$name-$k-of-$of/$name/shard-$k-of-$of.json" ] || lost="$lost $k"
            done
            if [ -n "$lost" ]; then
              echo "::warning::$name: shard(s)$lost of $of failed"
              declared+=("$name=shard(s)$lost of $of failed")
              continue
            fi
            mkdir -p "art/$name" "unpacked/$name"
            tar -xzf "$record/state.tar.gz" -C "unpacked/$name"
            cp "unpacked/$name/results/$name.json" "art/$name/recording.json"
            cp "$record/accepted.json" "art/$name/accepted.json"
            cp unpacked/"$name"/logs/evidence/*.tar.gz evidence/ 2>/dev/null || true
            # By number, not by pattern: one project's name can begin another's (kafka, kafka-core).
            for k in $(seq 1 "$of"); do
              shard="downloaded/shard-$name-$k-of-$of"
              cp "$shard/$name/shard-$k-of-$of.json" "art/$name/"
              for kept in "$shard"/evidence/*.tar.gz; do
                cp "$kept" "evidence/shard-$name-$k-of-$of-$(basename "$kept")"
              done
            done
          done
          missing_args=()
          for entry in "${declared[@]+"${declared[@]}"}"; do missing_args+=(--missing "$entry"); done
          completes=()
          if [ -n "$COMPLETES" ]; then
            # The earlier run's newest draft: each merge attempt of a run adds a draft under the
            # same tag, and the last saw the most artifacts. A tag names none of them alone, and
            # `gh release download` takes only a tag, so the asset is fetched by its id.
            export TAG="sweep-$COMPLETES"
            gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.draft and .tag_name == env.TAG)
              | {at: .created_at, asset: .assets[]} | select(.asset.name == env.TAG + ".tar.gz")
              | [.at, .asset.id] | @tsv' > drafts.tsv
            asset=$(sort -r drafts.tsv | head -n 1 | cut -f 2)
            [ -n "$asset" ] || { echo "run $COMPLETES has no draft release $TAG to complete"; exit 1; }
            gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$asset" \
              > previous.tar.gz
            mkdir -p previous
            tar -xzf previous.tar.gz -C previous
            rm previous.tar.gz
            completes=(--completes previous)
          fi
          python3 bench/merge.py art --planned $names "${missing_args[@]+"${missing_args[@]}"}" \
            --arm "$ARM" --out merged "${completes[@]+"${completes[@]}"}"
          partial=("${declared[@]+"${declared[@]}"}")
          title="Benchmark sweep $RUN ($ARM arm)"
          notes="Merged results of sweep run $RUN, with the maps and decision records."
          if [ -n "$COMPLETES" ]; then
            # The release stands alone, as the replay job reads it: the earlier run's projects
            # and evidence come along.
            mkdir -p art
            cp -R previous/art/. art/
            cp -R previous/evidence/. evidence/
            title="Benchmark sweep $RUN ($ARM arm, completes $COMPLETES)"
            notes="Merged results of sweep run $RUN and of sweep run $COMPLETES, which it completes,"
            notes="$notes with the maps and decision records."
            # What the earlier run lacked and this one did not re-run is missing still.
            mapfile -t partial < <(jq -r '.missing | to_entries[] | "\(.key)=\(.value)"' \
              "$(find merged -name sweep.json)")
          fi
          # The merged results and each job's evidence (its maps and decision records), not the
          # guests' checkouts.
          tar -czf "sweep-$RUN.tar.gz" merged art evidence
          if [ "${#partial[@]}" -gt 0 ]; then
            title="${title%)}, PARTIAL)"
            notes="$notes

          Missing, so this is not the planned sweep: $(printf '%s; ' "${partial[@]}")"
          fi
          gh release create "sweep-$RUN" --draft --title "$title" \
            --notes "$notes" "sweep-$RUN.tar.gz"
          if [ "${#declared[@]}" -gt 0 ]; then
            echo "::error::missing from this sweep: $(printf '%s; ' "${declared[@]}")"
            exit 1
          fi
      # The run page: one section per merged project. Also after the merge step failed for a missing
      # project, which it does after the release; a fault here never turns the sweep red.
      - name: write the run page
        if: ${{ !cancelled() && hashFiles('merged/**/sweep.json') != '' }}
        continue-on-error: true
        run: python3 bench/sweep_page.py merged unpacked >> "$GITHUB_STEP_SUMMARY"
      # The one download a reader needs: the merged results, also of a sweep that ends red for a
      # missing project. The record-* and shard-* artifacts stay for re-running a slice or the
      # merge; a re-run merge replaces this one.
      - if: ${{ !cancelled() && hashFiles('merged/**/sweep.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-results
          path: merged/
          retention-days: 90
          if-no-files-found: error
          overwrite: true
