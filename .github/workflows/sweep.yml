name: sweep

# A benchmark sweep, on dispatch and weekly on `main`: never on a pull request, whose code would run
# with this workflow's time and, in the merge job, its write access.
#
# Each project records in one job (capture, baseline, preflight, the compile gate over its draw
# order), which fixes its accepted target list and cuts it into slices. Each slice is one job that
# runs both arms of its rows, so a row's two times come from one machine. The merge job folds the
# slices back into the file one job would have written (bench/merge.py) and attaches the results,
# with the maps and decision records, to a draft release for a maintainer to publish.
#
# What runs follows from what changed since `base` (bench/tier.py) unless `tier` names it: nothing,
# an offline replay of the last published sweep's rows, the reduced arm, or every project. A full
# sweep covers the projects `only` names: `demo` unless told otherwise, `all` for every project. A
# dispatch that leaves `only` empty gets its default, `demo`; only a run with no inputs at all (a
# schedule) sees it empty, and sweeps every project.
#
# Weekly, the full arm of every project on `main`'s head, so a harness defect or a cost regression
# shows up within a week of the change rather than on release night; a scheduled run that fails
# opens an issue (last job). It takes about 7.5 to 10 hours, an estimate from the first full run on
# these runners until a scheduled one measures it. A scheduled workflow that sees no repository activity for 60
# days is disabled by GitHub; the release check checks it is on.
on:
  # Friday evening in Europe, off the hour, which GitHub delays and drops scheduled runs at most; it
  # ends on Saturday.
  schedule:
    - cron: '17 20 * * 5'
  workflow_dispatch:
    inputs:
      tier:
        description: auto decides from the change since base
        type: choice
        options: [auto, replay, reduced, full, control]
        default: auto
      base:
        description: the commit the last published figures describe (empty is the latest v* tag)
        type: string
        default: ''
      major_release:
        description: this is a major release, which sweeps everything
        type: boolean
        default: false
      only:
        description: space-separated projects to restrict a full sweep to, or all for every project
        type: string
        default: demo
      # Measured on the demo: a runner's selected arm took a median 1.38 times, and its compile gate
      # 1.5 times, what the same rows took on the machine that measured the last local times.
      factor:
        description: runner seconds per local second, measured on the demo
        type: string
        default: '1.5'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          TIER: ${{ inputs.tier }}
          BASE: ${{ inputs.base }}
          MAJOR: ${{ inputs.major_release }}
          ONLY: ${{ inputs.only }}
        run: |
          set -eu
          # A scheduled run has no inputs; it sweeps the full arm. A dispatch always carries a tier.
          TIER=${TIER:-full}
          if [ "$TIER" = auto ]; then
            base=${BASE:-$(git describe --tags --abbrev=0 --match 'v*')}
            major=()
            [ "$MAJOR" = true ] && major=(--major-release)
            TIER=$(python3 bench/tier.py "$base" HEAD "${major[@]}" | jq -r .tier)
          fi
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          projects='[]'
          if [ "$TIER" = reduced ] || [ "$TIER" = full ]; then
            only=()
            # The reduced arm names its own projects and refuses --only.
            [ -n "$ONLY" ] && [ "$ONLY" != all ] && [ "$TIER" = full ] && only=(--only $ONLY)
            projects=$(python3 bench/sweep_corpus.py --arm "$TIER" "${only[@]}" --print-commands)
          fi
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "tier: $TIER"

  # The positive control: a plugin built with a planted miss, swept on the fixtures. It fails unless
  # every fixture reports the miss, so a harness that lost the ability to see one cannot pass.
  control:
    needs: plan
    if: needs.plan.outputs.tier == 'control'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - run: python3 bench/controls.py

  # Selection logic alone: the last published sweep's rows re-asked of this selector, offline. A
  # pass or a fail, never new figures.
  replay:
    needs: plan
    if: needs.plan.outputs.tier == 'replay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: replay the last published sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ./gradlew :agent:jar --console=plain
          tag=$(gh release list --json tagName,isDraft \
                  --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("sweep-"))][0]')
          [ -n "$tag" ] || { echo "no published sweep to replay"; exit 1; }
          gh release download "$tag" --pattern 'sweep-*.tar.gz' --dir published
          tar -xzf published/sweep-*.tar.gz -C published
          mkdir -p bench/results bench/logs
          cp published/merged/*.json bench/results/
          rm -f bench/results/sweep.json
          for kept in published/evidence/*.tar.gz; do tar -xzf "$kept" -C bench/logs; done
          python3 bench/replay_decisions.py

  record:
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # A guest may resolve dependencies from GitHub Packages, which takes a token even for a public
    # package: bitwarden-android's SDK. Read-only, and handed to that project's build alone below.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            11
            17
            25
            26
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: record and cut into slices
        env:
          NAME: ${{ matrix.project.project }}
          ARGS: ${{ toJSON(matrix.project.args) }}
          GITHUB_TOKEN: ${{ matrix.project.project == 'bitwarden-android' && github.token || '' }}
          # Relative to bench/; another project's clone for one measured in it (detekt-junk).
          CHECKOUT: ${{ matrix.project.checkout }}
          FACTOR: ${{ inputs.factor }}
        run: |
          set -eu
          mapfile -t args < <(jq -r '.[]' <<< "$ARGS")
          python3 bench/run.py "${args[@]}" --accepted-out "bench/logs/$NAME/accepted.json"
          # The dispatch input's default, for a scheduled run, which has none.
          python3 bench/shard.py "bench/logs/$NAME/accepted.json" --factor "${FACTOR:-1.5}"
          # A tar, not the artifact's own zip, which drops the checkout's executable bits. Under the
          # project's name, because one artifact downloads without its own directory and several
          # with: readers find `<project>/accepted.json` either way.
          mkdir -p "record/$NAME"
          cp "bench/logs/$NAME/accepted.json" "record/$NAME/"
          tar -czf "record/$NAME/state.tar.gz" -C bench "logs/$NAME" "results/$NAME.json" \
            "$CHECKOUT" logs/evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-${{ matrix.project.project }}
          retention-days: 3
          path: record/
      # A record job that fails says why in its logs, not in the job's own output: the warm-up's
      # build error, the stalled capture's last lines. Not named record-*, which the slices read.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-record-${{ matrix.project.project }}
          retention-days: 3
          path: bench/logs/${{ matrix.project.project }}/*.log

  slices:
    needs: [plan, record]
    # Also when some record jobs failed: one failed project must not cost every other one its rows.
    # Each failed one is declared missing, and the merge fails the run after publishing the rest.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.slices.outputs.shards }}
      missing: ${{ steps.slices.outputs.missing }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: record-*
          path: records
      - id: slices
        env:
          PLAN: ${{ needs.plan.outputs.projects }}
          ARM: ${{ needs.plan.outputs.tier }}
        run: |
          set -eu
          # No pipeline: a failure inside one would not fail the step, and an empty list of
          # shards skips every job after it while the run reads as passed.
          mapfile -t plans < <(jq -c '.[]' <<< "$PLAN")
          : > shards.jsonl
          : > missing.jsonl
          for plan in "${plans[@]}"; do
            name=$(jq -r .project <<< "$plan")
            list=""
            if [ -d records ]; then
              list=$(find records -path "*/$name/accepted.json" -print -quit)
            fi
            if [ -z "$list" ]; then
              echo "::warning::$name: no accepted list; its record job failed"
              jq -nc --arg name "$name" '{project: $name, reason: "its record job failed"}' \
                >> missing.jsonl
              continue
            fi
            of=$(jq '.slices | length' "$list")
            if [ "$of" -lt 1 ]; then
              echo "::warning::$name was cut into no slices"
              jq -nc --arg name "$name" '{project: $name, reason: "it was cut into no slices"}' \
                >> missing.jsonl
              continue
            fi
            for k in $(seq 1 "$of"); do
              jq -c --argjson k "$k" --argjson of "$of" '. + {shard: $k, of: $of}' <<< "$plan" \
                >> shards.jsonl
            done
          done
          # The merge refuses a reduced arm short of a member, so its shards would measure for nothing.
          if [ "$ARM" = reduced ] && [ -s missing.jsonl ]; then
            echo "the reduced arm lacks a member: $(jq -sc . missing.jsonl)"; exit 1
          fi
          shards=$(jq -sc . shards.jsonl)
          [ "$shards" != "[]" ] || { echo "no project recorded, so there is nothing to measure"; exit 1; }
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "missing=$(jq -sc . missing.jsonl)" >> "$GITHUB_OUTPUT"

  shard:
    needs: slices
    # Without its own condition a failed record job, two jobs up, would skip every shard.
    if: ${{ !cancelled() && needs.slices.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.slices.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            11
            17
            25
            26
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: record-${{ matrix.slice.project }}
          # Outside the checkout: an untracked file in it makes run.py refuse the tree as dirty.
          path: ${{ runner.temp }}/record
      - name: measure this slice
        env:
          NAME: ${{ matrix.slice.project }}
          ARGS: ${{ toJSON(matrix.slice.args) }}
          GITHUB_TOKEN: ${{ matrix.slice.project == 'bitwarden-android' && github.token || '' }}
          SHARD: ${{ matrix.slice.shard }}/${{ matrix.slice.of }}
        run: |
          set -eu
          tar -xzf "$RUNNER_TEMP/record/$NAME/state.tar.gz" -C bench
          mapfile -t args < <(jq -r '.[] | select(. != "--recapture")' <<< "$ARGS")
          python3 bench/run.py "${args[@]}" --accepted "bench/logs/$NAME/accepted.json" \
            --shard "$SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.slice.project }}-${{ matrix.slice.shard }}-of-${{ matrix.slice.of }}
          retention-days: 3
          path: |
            bench/logs/${{ matrix.slice.project }}/shard-${{ matrix.slice.shard }}-of-${{ matrix.slice.of }}.json
            bench/logs/evidence/
            bench/logs/${{ matrix.slice.project }}/**/*.stall-*.log
            bench/logs/${{ matrix.slice.project }}/**/*.network-*.log

  merge:
    needs: [plan, slices, shard]
    # Also when a shard failed: its project is declared missing, as a failed record is.
    if: ${{ !cancelled() && needs.slices.result == 'success' }}
    runs-on: ubuntu-latest
    # The only job that can write, and it runs no guest code.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded
      - name: merge, and attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.outputs.projects }}
          MISSING: ${{ needs.slices.outputs.missing }}
          ARM: ${{ needs.plan.outputs.tier }}
          RUN: ${{ github.run_id }}
        run: |
          set -eu
          names=$(jq -r '.[].project' <<< "$PLAN")
          declared=()
          while IFS=$'\t' read -r name reason; do
            [ -n "$name" ] && declared+=("$name=$reason")
          done < <(jq -r '.[] | [.project, .reason] | @tsv' <<< "$MISSING")
          mkdir -p evidence
          for name in $names; do
            if printf '%s\n' "${declared[@]+"${declared[@]}"}" | grep -q "^$name="; then
              continue
            fi
            record=$(dirname "$(find downloaded/record-"$name" -path "*/$name/accepted.json" -print -quit)")
            of=$(jq '.slices | length' "$record/accepted.json")
            # Every shard or none: a project with a shard missing is declared, not merged short.
            lost=""
            for k in $(seq 1 "$of"); do
              [ -f "downloaded/shard-$name-$k-of-$of/$name/shard-$k-of-$of.json" ] || lost="$lost $k"
            done
            if [ -n "$lost" ]; then
              echo "::warning::$name: shard(s)$lost of $of failed"
              declared+=("$name=shard(s)$lost of $of failed")
              continue
            fi
            mkdir -p "art/$name" "unpacked/$name"
            tar -xzf "$record/state.tar.gz" -C "unpacked/$name"
            cp "unpacked/$name/results/$name.json" "art/$name/recording.json"
            cp "$record/accepted.json" "art/$name/accepted.json"
            cp unpacked/"$name"/logs/evidence/*.tar.gz evidence/ 2>/dev/null || true
            # By number, not by pattern: one project's name can begin another's (kafka, kafka-core).
            for k in $(seq 1 "$of"); do
              shard="downloaded/shard-$name-$k-of-$of"
              cp "$shard/$name/shard-$k-of-$of.json" "art/$name/"
              for kept in "$shard"/evidence/*.tar.gz; do
                cp "$kept" "evidence/shard-$name-$k-of-$of-$(basename "$kept")"
              done
            done
          done
          missing_args=()
          for entry in "${declared[@]+"${declared[@]}"}"; do missing_args+=(--missing "$entry"); done
          python3 bench/merge.py art --planned $names "${missing_args[@]+"${missing_args[@]}"}" \
            --arm "$ARM" --out merged
          # The merged results and each job's evidence (its maps and decision records), not the
          # guests' checkouts.
          tar -czf "sweep-$RUN.tar.gz" merged art evidence
          title="Benchmark sweep $RUN ($ARM arm)"
          notes="Merged results of sweep run $RUN, with the maps and decision records."
          if [ "${#declared[@]}" -gt 0 ]; then
            title="Benchmark sweep $RUN ($ARM arm, PARTIAL)"
            notes="$notes

          Missing, so this is not the planned sweep: $(printf '%s; ' "${declared[@]}")"
          fi
          gh release create "sweep-$RUN" --draft --title "$title" \
            --notes "$notes" "sweep-$RUN.tar.gz"
          if [ "${#declared[@]}" -gt 0 ]; then
            echo "::error::missing from this sweep: $(printf '%s; ' "${declared[@]}")"
            exit 1
          fi

  # Only a scheduled run has nobody watching it; a dispatched one is read by whoever started it.
  report-failure:
    needs: [plan, control, replay, record, slices, shard, merge]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue create -R "$REPO" --title "Scheduled benchmark sweep failed" --body "$URL"
