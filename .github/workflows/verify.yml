name: verify

# Builds and tests the plugin, then checks the thing a local run cannot: that a coverage map built
# on one machine selects correctly on another, from a cold checkout.
# A pull request that changes only Markdown or docs runs nothing but the `changes` job, and every
# other job reports skipped, which satisfies the required checks; docs/contract.md (the agent's
# tests check its constants against it, the plugin's its published tokens), docs/reference.md (the
# plugin's tests check the names, flags and printed lines it quotes against the code, test_ci.py its
# supported matrix against matrix.yml) and SECURITY.md (test_ci.py checks its key fingerprint
# against RELEASE-KEY.asc) count as code. A pull request that changes only paths no suite reads
# (the benchmark, the guard harness, the workflows and scripts this one does not run) runs
# test_ci.py alone; one that changes only maven/ or only plugin/ besides those skips the other's
# suites (.github/ci.py scope). A push to main keeps the path filter, and runs only the job groups
# its pull request's run did not prove, when that run tested the pushed tree (.github/ci.py
# reuse-on-push); anything else runs everything.
on:
  push:
    branches: [main]
    paths: ['**', '!**/*.md', '!docs/**', 'docs/contract.md', 'docs/reference.md', 'SECURITY.md']
  # Only pull requests into main: a docs-only pull request into another branch, retargeted to main,
  # must not bring its skipped checks along. Retargeted, its required checks are missing until a push.
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Every push to main runs on its own, so no
# merge goes unchecked.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Read-only, no secrets, and triggered by pull_request rather than pull_request_target, so a
# fork's code cannot reach anything.
permissions:
  contents: read

# The build runs on Gradle 8.14, the supported floor, on purpose (CONTRIBUTING.md); turning off
# setup-gradle's build capture is the action's only way to drop its "out of date" notice.
env:
  GRADLE_ACTIONS_SKIP_BUILD_RESULT_CAPTURE: 'true'

# The build in parallel jobs, split by task, and each functional suite further by test class into
# shards: together they run everything `./gradlew build` runs, and the slowest shard sets the time.
# A check job per suite, named as the suite, proves every test class ran in exactly one shard.
# Each build of the root project passes --build-cache, so a job reuses the compiled outputs of
# earlier runs on main, where setup-gradle saves its cache; its tests still run (build.gradle.kts).
# The sample builds go without it: the map jobs read what their test runs did.
jobs:
  # Whether this run needs the build at all, and which job groups its paths can affect
  # (.github/ci.py scope): `unit` the Gradle build, `maven` the Maven shards, `gradle` the Gradle
  # functional suites, the map jobs and the coverage gate. A pull request that changes only docs
  # skips every job below, and a skipped job satisfies a required check, where a path filter on the
  # trigger would leave the required checks waiting forever. The jobs run unless this says `false`,
  # so a detector that failed or said nothing runs everything: a wrong "not needed" would skip a
  # check. A push to main skips a group only when the merged pull request's newest run passed, said
  # it tested this tree, and every job of that group succeeded in it; a dispatch runs everything.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # Only this job reads other runs, their jobs and logs, and the pull request a commit merged.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
      unit: ${{ steps.decide.outputs.unit }}
      maven: ${{ steps.decide.outputs.maven }}
      gradle: ${{ steps.decide.outputs.gradle }}
      reused: ${{ steps.decide.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A push to main reads them back from its pull request's run: on a pull request, the head
      # merged with the base of that moment.
      - name: the tree this run tests
        run: echo "tested tree $(git rev-parse 'HEAD^{tree}')"
      # The answers a push to main can take from its pull request's run. A run of that head still
      # finishing (its run summary) is waited for, about two minutes. Any failure leaves no answer.
      - id: reuse
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/reuse"
          mkdir -p "$dir"
          gh api "repos/$REPO/commits/$SHA/pulls" > "$dir/pulls.json"
          # GitHub may link a commit to its pull request seconds after the push.
          if [ "$(jq length "$dir/pulls.json")" = 0 ]; then
            sleep 10
            gh api "repos/$REPO/commits/$SHA/pulls" > "$dir/pulls.json"
          fi
          head=$(jq -r --arg sha "$SHA" '[.[] | select(.merge_commit_sha == $sha)] | if length == 1 then .[0].head.sha else "" end' "$dir/pulls.json")
          if [ -n "$head" ]; then
            for attempt in 1 2 3 4 5 6 7 8 9; do
              gh api "repos/$REPO/actions/workflows/verify.yml/runs?head_sha=$head&event=pull_request" > "$dir/runs.json"
              [ "$(jq -r '.workflow_runs[0].status // "completed"' "$dir/runs.json")" != completed ] || break
              [ "$attempt" = 9 ] || sleep 15
            done
            run=$(jq -r '.workflow_runs[0].id // empty' "$dir/runs.json")
            if [ -n "$run" ]; then
              gh api "repos/$REPO/actions/runs/$run/jobs?filter=latest&per_page=100" > "$dir/jobs.json"
              job=$(jq -r '[.jobs[] | select(.name == "what changed")][0].id // empty' "$dir/jobs.json")
              [ -z "$job" ] || curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                "$GITHUB_API_URL/repos/$REPO/actions/jobs/$job/logs" > "$dir/changes.log"
            fi
          fi
          python3 .github/ci.py reuse-on-push "$dir" --sha "$SHA" --tree "$(git rev-parse 'HEAD^{tree}')" > "$dir/answer"
          cat "$dir/answer" >> "$GITHUB_OUTPUT"
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          UNIT: ${{ steps.reuse.outputs.unit }}
          MAVEN: ${{ steps.reuse.outputs.maven }}
          GRADLE: ${{ steps.reuse.outputs.gradle }}
          REUSED: ${{ steps.reuse.outputs.reused }}
          OUTCOME: ${{ steps.reuse.outcome }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            {
              echo "code=$(python3 .github/ci.py needs-checks "$BASE" "$HEAD")"
              python3 .github/ci.py scope "$BASE" "$HEAD"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unit=true maven=true gradle=true reused="nothing reused: a $EVENT run runs everything"
          if [ "$EVENT" = push ]; then
            reused="nothing reused: the reuse step ended $OUTCOME without an answer"
            # Only the answers ci.py can give: `maven` or `gradle` true keeps `unit` true.
            case "$UNIT,$MAVEN,$GRADLE" in
              true,true,true|true,true,false|true,false,true|true,false,false|false,false,false)
                unit=$UNIT maven=$MAVEN gradle=$GRADLE reused=$REUSED ;;
            esac
          fi
          printf 'code=true\nunit=%s\nmaven=%s\ngradle=%s\nreused=%s\n' "$unit" "$maven" "$gradle" "$reused" >> "$GITHUB_OUTPUT"
          echo "$reused"

  # The unit and agent suites and the release's checks; the Maven suite runs in shards below, and
  # the check named as this job was gates on both. A change no suite reads runs test_ci.py alone.
  build:
    name: unit and agent suites (build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: needs.changes.outputs.unit != 'false'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: needs.changes.outputs.unit != 'false'
        with:
          # The release signing check's refusals fail builds by design; its steps tell what failed.
          add-job-summary: never
      # The plugin's coverage gate needs the functional suites, which run in the shards below; the
      # coverage job gates on this job's unit-test data and theirs.
      - run: ./gradlew build :agent:jacocoTestReport -x :plugin:functionalTest -x :plugin:functionalTestGradle9 -Pyoriwake.functional.coverage=false --build-cache --console=plain
        if: needs.changes.outputs.unit != 'false'
      - run: python3 .github/test_ci.py
      - run: python3 scripts/test_central_bundle.py
        if: needs.changes.outputs.unit != 'false'
      # The bundle the release would upload: a POM or jar Central refuses shows here, not first at a
      # tag. At a release-shaped version, since a snapshot's files are named by their timestamp.
      - name: the Maven Central bundle is complete
        if: needs.changes.outputs.unit != 'false'
        run: |
          ./gradlew :maven:publishMavenPluginPublicationToBuildLocalRepository -PreleaseVersion=0.0.0-check --build-cache --console=plain
          python3 scripts/central_bundle.py maven/build/local-repository io.github.zeuspizza yoriwake-maven-plugin \
            0.0.0-check "$RUNNER_TEMP/central-bundle.zip"
      - name: the release's signing and upload refusal work
        if: needs.changes.outputs.unit != 'false'
        run: .github/check_release_signing.sh
      # The coverage job reads it; kept a day: a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.unit != 'false'
        with:
          name: coverage-linux-unit
          path: plugin/build/jacoco/test.exec
          if-no-files-found: error
          retention-days: 1
      # The agent's measured coverage, so a ratchet is set from this run without another.
      # A person reads it: setting a ratchet from a green pull request's run, or reading a red gate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && needs.changes.outputs.unit != 'false' }}
        with:
          name: coverage-report-agent
          path: agent/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn
          retention-days: 7
      # The run summary and a person read it when the Linux unit build failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && needs.changes.outputs.unit != 'false'
        with:
          name: test-results-linux-unit
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 7
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always() && needs.changes.outputs.unit != 'false'
        run: ./gradlew --stop

  maven-shard:
    name: functional on Maven (shard ${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.maven != 'false' }}
    runs-on: ubuntu-24.04
    # About 1.5 times the slowest shard measured on CI (p95 20-22 min): a hung shard fails here,
    # not at six hours.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          add-job-summary: on-failure
      # The Maven suite's distributions, fetched once and kept: setup-gradle's cache leaves them out.
      # Keyed on the file that pins their versions and SHA-512s; an older set still restores, so a
      # new version is the only fetch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/yoriwake-maven-distributions
          key: maven-distributions-${{ hashFiles('maven/src/functionalTest/kotlin/io/github/zeuspizza/yoriwake/maven/FunctionalMaven.kt') }}
          restore-keys: maven-distributions-
      # What an earlier run on main downloaded for this shard's fixtures, read behind each build's own
      # local repository so Central is asked only for what it lacks; the guard jobs read all three.
      # A seed only grows: to drop one that holds a bad file, bump v1 here and in guards.yml.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/yoriwake-seed-${{ matrix.shard }}
          key: maven-repo-v1-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: maven-repo-v1-${{ matrix.shard }}-
      - run: YORIWAKE_MAVEN_REPO_TAIL="$HOME/.m2/yoriwake-seed-${{ matrix.shard }}" ./gradlew :maven:functionalTest -Pyoriwake.functional.shard=${{ matrix.shard }}/3 -Pyoriwake.functional.shardTable=linux --continue --build-cache --console=plain
      # Saved from main only, and only when the shard downloaded something new: a pull request's
      # caches would crowd the repository's others, and an unchanged seed needs no new copy.
      - id: seed
        if: always() && github.event_name == 'push'
        run: python3 .github/ci.py seed-maven-repo maven/build/functional-m2 "$HOME/.m2/yoriwake-seed-${{ matrix.shard }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.seed.outputs.added != '' && steps.seed.outputs.added != '0'
        with:
          path: ~/.m2/yoriwake-seed-${{ matrix.shard }}
          key: maven-repo-v1-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Always, and an error when empty: the check below reads every shard's results.
      # Kept a day: a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: functional-maven-functionalTest-${{ matrix.shard }}-of-3
          path: maven/build/test-results/functionalTest/*.xml
          if-no-files-found: error
          retention-days: 1
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  # Named as the job that ran the unit suites and the Maven suite together, and the check that is
  # required: the build job and every Maven shard succeeded, and every Maven test class the sources
  # declare ran in exactly one shard.
  maven:
    name: unit and agent suites
    needs: [changes, maven-shard, build]
    if: always() && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every shard succeeded
        if: needs.changes.outputs.maven != 'false' && needs.maven-shard.result != 'success'
        run: |
          echo "a shard of functional on Maven did not succeed: ${{ needs.maven-shard.result }}"
          exit 1
      - name: the unit and agent suites succeeded
        if: needs.build.result != 'success'
        run: |
          echo "unit and agent suites (build) did not succeed: ${{ needs.build.result }}"
          exit 1
      # The Maven shards' own checks, when a change needed them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.maven != 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.maven != 'false'
        with:
          pattern: functional-maven-functionalTest-*
          path: shards
      - name: every test class ran in exactly one shard
        if: needs.changes.outputs.maven != 'false'
        run: python3 .github/functional_shards.py check shards --count 3 --module maven

  functional-shard:
    name: functional on Gradle 8.14 (shard ${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.gradle != 'false' }}
    runs-on: ubuntu-24.04
    # About 1.5 times the slowest shard measured on CI (p95 20-22 min): a hung shard fails here,
    # not at six hours.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          add-job-summary: on-failure
      # What earlier runs on main downloaded for the fixture builds, read behind each TestKit home's
      # own cache (GRADLE_RO_DEP_CACHE, never written), so Central is asked only for what it lacks.
      # The gradle-seed job builds it; the guard jobs read it too.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle-seed/caches/modules-2
          key: gradle-seed-v1-${{ github.run_id }}
          restore-keys: gradle-seed-v1-
      - shell: bash
        run: YORIWAKE_GRADLE_RO_DEP_CACHE="$HOME/.gradle-seed/caches" ./gradlew :plugin:functionalTest -x functionalTestGradle9 -Pyoriwake.functional.shard=${{ matrix.shard }}/3 -Pyoriwake.functional.shardTable=linux --continue --build-cache --console=plain
      # What each TestKit home downloaded, on every run: the log says how many files, and the
      # gradle-seed job seeds what they name. A flake leaves nothing to diagnose once the runner
      # is gone: the listing tells a dependency that never arrived from one that could not be
      # read, and the homes' daemon logs, the Tooling API home's included, go with it.
      - name: list what the TestKit homes downloaded
        if: always()
        shell: bash
        run: python3 .github/ci.py list-test-kit-homes plugin/build/tmp > plugin/build/test-kit-homes.txt
      # The gradle-seed job of the same push to main reads it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'push'
        with:
          name: test-kit-listing-functionalTest-${{ matrix.shard }}-of-3
          path: plugin/build/test-kit-homes.txt
          if-no-files-found: ignore
          retention-days: 1
      # A person reads it to see what a failed shard's TestKit daemons downloaded and logged.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-kit-homes-linux-functionalTest-${{ matrix.shard }}-of-3
          path: |
            plugin/build/test-kit-homes.txt
            plugin/build/test-kit-diagnostics/
            plugin/build/tmp/*/work/.gradle-test-kit-*/daemon/**/*.log
            plugin/build/tmp/*/work/.gradle-test-kit-*/test-kit-daemon/**/*.log
            plugin/build/tmp/*/work/.gradle-tooling-api-*/daemon/**/*.log
          include-hidden-files: true
          retention-days: 7
      # Always, and an error when empty: the check below reads every shard's results.
      # Kept a day: a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: functional-linux-functionalTest-${{ matrix.shard }}-of-3
          path: plugin/build/test-results/functionalTest/*.xml
          if-no-files-found: error
          retention-days: 1
      # The daemons' coverage and the test JVM's own, for the coverage job.
      # Kept a day: a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-linux-functionalTest-${{ matrix.shard }}-of-3
          path: plugin/build/jacoco/
          if-no-files-found: error
          retention-days: 1
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  # Named as the unsharded job was, and the check that is required: every shard succeeded and
  # every test class the sources declare ran in exactly one of them.
  functional:
    name: functional on Gradle 8.14
    needs: [changes, functional-shard]
    if: always() && needs.changes.outputs.gradle != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every shard succeeded
        if: needs.functional-shard.result != 'success'
        run: |
          echo "a shard of functional on Gradle 8.14 did not succeed: ${{ needs.functional-shard.result }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: functional-linux-functionalTest-*
          path: shards
      - name: every test class ran in exactly one shard
        run: python3 .github/functional_shards.py check shards --count 3

  functional-gradle9-shard:
    name: functional on Gradle 9 (shard ${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.gradle != 'false' }}
    runs-on: ubuntu-24.04
    # About 1.5 times the slowest shard measured on CI (p95 20-22 min): a hung shard fails here,
    # not at six hours.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          add-job-summary: on-failure
      # What earlier runs on main downloaded for the fixture builds, read behind each TestKit home's
      # own cache (GRADLE_RO_DEP_CACHE, never written), so Central is asked only for what it lacks.
      # The gradle-seed job builds it; the guard jobs read it too.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle-seed/caches/modules-2
          key: gradle-seed-v1-${{ github.run_id }}
          restore-keys: gradle-seed-v1-
      - shell: bash
        run: YORIWAKE_GRADLE_RO_DEP_CACHE="$HOME/.gradle-seed/caches" ./gradlew :plugin:functionalTestGradle9 -Pyoriwake.functional.shard=${{ matrix.shard }}/3 -Pyoriwake.functional.shardTable=linux --continue --build-cache --console=plain
      # What each TestKit home downloaded, on every run: the log says how many files, and the
      # gradle-seed job seeds what they name. A flake leaves nothing to diagnose once the runner
      # is gone: the listing tells a dependency that never arrived from one that could not be
      # read, and the homes' daemon logs, the Tooling API home's included, go with it.
      - name: list what the TestKit homes downloaded
        if: always()
        shell: bash
        run: python3 .github/ci.py list-test-kit-homes plugin/build/tmp > plugin/build/test-kit-homes.txt
      # The gradle-seed job of the same push to main reads it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'push'
        with:
          name: test-kit-listing-functionalTestGradle9-${{ matrix.shard }}-of-3
          path: plugin/build/test-kit-homes.txt
          if-no-files-found: ignore
          retention-days: 1
      # A person reads it to see what a failed shard's TestKit daemons downloaded and logged.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-kit-homes-linux-functionalTestGradle9-${{ matrix.shard }}-of-3
          path: |
            plugin/build/test-kit-homes.txt
            plugin/build/test-kit-diagnostics/
            plugin/build/tmp/*/work/.gradle-test-kit-*/daemon/**/*.log
            plugin/build/tmp/*/work/.gradle-test-kit-*/test-kit-daemon/**/*.log
            plugin/build/tmp/*/work/.gradle-tooling-api-*/daemon/**/*.log
          include-hidden-files: true
          retention-days: 7
      # Always, and an error when empty: the check below reads every shard's results.
      # Kept a day: a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: functional-linux-functionalTestGradle9-${{ matrix.shard }}-of-3
          path: plugin/build/test-results/functionalTestGradle9/*.xml
          if-no-files-found: error
          retention-days: 1
      # The daemons' coverage and the test JVM's own, for the coverage job.
      # Kept a day: a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-linux-functionalTestGradle9-${{ matrix.shard }}-of-3
          path: plugin/build/jacoco/
          if-no-files-found: error
          retention-days: 1
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  # Named as the unsharded job was, and the check that is required: every shard succeeded and
  # every test class the sources declare ran in exactly one of them.
  functional-gradle9:
    name: functional on Gradle 9
    needs: [changes, functional-gradle9-shard]
    if: always() && needs.changes.outputs.gradle != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every shard succeeded
        if: needs.functional-gradle9-shard.result != 'success'
        run: |
          echo "a shard of functional on Gradle 9 did not succeed: ${{ needs.functional-gradle9-shard.result }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: functional-linux-functionalTestGradle9-*
          path: shards
      - name: every test class ran in exactly one shard
        run: python3 .github/functional_shards.py check shards --count 3

  # One seed of what the fixture builds download, for the functional shards and the guard jobs.
  # Built by Gradle, so its indexes hold every shard's modules: one guard job runs classes of all
  # six shards, and Gradle reads one read-only cache. Saved from main only, when it grew; a push
  # that reused its pull request's shards has no listing and leaves the seed as it is. A seed
  # only grows: to drop one that holds a bad file, bump v1 here, in the shards and in guards.yml.
  gradle-seed:
    name: seed the fixture builds' dependencies
    needs: [changes, functional-shard, functional-gradle9-shard]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.changes.outputs.code != 'false' && needs.changes.outputs.gradle != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle-seed/caches/modules-2
          key: gradle-seed-v1-${{ github.run_id }}
          restore-keys: gradle-seed-v1-
      # None when every shard failed before listing: the seed is then left as it is.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: test-kit-listing-*
          path: ${{ runner.temp }}/listings
      - id: listings
        run: |
          count=$(find "$RUNNER_TEMP/listings" -name test-kit-homes.txt 2>/dev/null | wc -l)
          echo "$count TestKit home listings"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      # Under each fixture Gradle version: the versions share the downloaded files and keep their
      # own metadata indexes. The versions of plugin/build.gradle.kts' functionalGradleVersions.
      # A download that fails here leaves the seed as it is, unsaved; it turns no run red.
      - id: seed
        if: steps.listings.outputs.count != '0'
        continue-on-error: true
        run: |
          set -eu
          home="$HOME/.gradle-seed"
          python3 .github/ci.py gradle-seed-size "$home" | sed 's/^/before_/' >> "$GITHUB_OUTPUT"
          for version in 8.14 9.8.0; do
            find "$RUNNER_TEMP/listings" -name test-kit-homes.txt -print0 \
              | xargs -0 python3 .github/ci.py gradle-seed "$home" --gradle "$version"
          done
          # Gradle reads a read-only cache without its locks and its clean-up marker.
          find "$home/caches/modules-2" \( -name '*.lock' -o -name gc.properties \) -delete
          python3 .github/ci.py gradle-seed-size "$home" | tee -a "$GITHUB_OUTPUT"
      # The repository's 10 GB of caches also hold setup-gradle's, the Maven seeds and more.
      - name: the seed stays under 500 MB
        if: steps.seed.outcome == 'success'
        env:
          BYTES: ${{ steps.seed.outputs.bytes }}
        run: |
          echo "the seed holds $BYTES bytes"
          [ "$BYTES" -le 524288000 ] || { echo "over 500 MB: not saved"; exit 1; }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          steps.seed.outcome == 'success'
          && (steps.seed.outputs.files != steps.seed.outputs.before_files
          || steps.seed.outputs.bytes != steps.seed.outputs.before_bytes)
        with:
          path: ~/.gradle-seed/caches/modules-2
          key: gradle-seed-v1-${{ github.run_id }}-${{ github.run_attempt }}

  # The plugin's coverage gate over the unit tests and every Linux shard of both functional suites,
  # as `./gradlew build` gates locally. The report goes up unless the run was cancelled, so a ratchet
  # is set and a red gate read from this run without another.
  coverage:
    name: coverage gate
    needs: [changes, build, functional-shard, functional-gradle9-shard]
    if: ${{ !cancelled() && needs.changes.outputs.gradle != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The gate's refusal of missing data fails a build by design; its steps tell what failed.
          add-job-summary: never
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-linux-*
          path: coverage-data
      - run: ./gradlew :plugin:jacocoTestReport :plugin:jacocoTestCoverageVerification -Pyoriwake.coverage.data=coverage-data --continue --build-cache --console=plain
      # The gate must refuse rather than pass on the unit tests alone: given only their data, it
      # fails and names both functional suites.
      - name: the gate refuses missing functional data
        run: |
          mkdir unit-only
          cp coverage-data/coverage-linux-unit/test.exec unit-only/
          if ./gradlew :plugin:jacocoTestCoverageVerification -Pyoriwake.coverage.data=unit-only --build-cache --console=plain > refusal.log 2>&1; then
            cat refusal.log
            echo "the coverage gate passed with no functional data"
            exit 1
          fi
          grep -q "no daemon coverage from functionalTest and functionalTestGradle9" refusal.log || { cat refusal.log; exit 1; }
      # A person reads it: setting a ratchet from a green pull request's run, or reading a red gate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-report-plugin
          path: |
            plugin/build/reports/jacoco/test/jacocoTestReport.xml
            coverage-data/**/summary.txt
          if-no-files-found: warn
          retention-days: 7
      # A person reads it when the coverage gate failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: coverage-report-plugin-html
          path: plugin/build/reports/jacoco/test/html/
          retention-days: 7
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  capture:
    name: build a map
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.gradle != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The JDK the map was captured on, for the job that selects against it on the same OS.
    outputs:
      jdk: ${{ steps.java.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: java
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          add-job-summary: on-failure

      - name: publish the plugin locally
        run: ./gradlew :plugin:publishToMavenLocal --build-cache --console=plain

      # Isolated, one test JVM per test class: the sample's classes all run in one JVM, so a shared
      # capture keeps every test that ran after the changed class first loaded, and the selection
      # below could not show that unrelated tests are skipped.
      - name: run the sample suite, capturing coverage
        run: ./gradlew -p samples/demo test -Pyoriwake.isolatedCapture --console=plain

      # Not `find`: it does not exist on the Windows runner, and this step has to read the same on
      # every operating system the workflow crosses. `.github/ci.py` is the one interpreter
      # every job already needs, because assert_selection.py decides them.
      - name: check a map was actually written
        shell: bash
        run: |
          set -eu
          map=$(python3 .github/ci.py find-map samples/demo)
          grep -q "dev.demo.Alpha" "$map"

      # The select jobs of this run read it; a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-map
          path: samples/demo/.gradle/yoriwake
          include-hidden-files: true
          retention-days: 1
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  select:
    name: select on another machine
    needs: [changes, capture]
    if: ${{ !cancelled() && needs.changes.outputs.gradle != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # A fresh checkout on a different runner, with no build outputs and no map of its own. This is
      # the CI shape: restore the map, change something, run only what the change can reach.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The map's JDK: another patch release would rightly run every test.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ needs.capture.outputs.jdk }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The mutated source fails its builds by design; the assertion tells what failed.
          add-job-summary: never

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-map
          path: samples/demo/.gradle/yoriwake

      - name: publish the plugin locally
        run: ./gradlew :plugin:publishToMavenLocal --build-cache --console=plain

      # Not `sed -i`: its flags differ between GNU and BSD, Windows has neither, and `sed` exits 0
      # when nothing matches. ci.py refuses a mutation that did not apply.
      - name: break Alpha so its tests fail
        shell: bash
        run: |
          set -eu
          python3 .github/ci.py mutate samples/demo/src/main/java/dev/demo/Alpha.java
          git diff --name-only

      # The mutation makes tests fail, so a non-zero exit is expected here; the assertion below
      # is what decides the job. Gradle's own failure is still visible in the log.
      - name: run only the tests the change can reach
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      - name: the change's own tests ran and failed, the unrelated ones did not
        run: YORIWAKE_REQUIRE_DECISIONS=1 python3 .github/assert_selection.py

      # A class only a resource names: nothing in bytecode leads from it to its test, so this
      # round is the resource scan's, where the first was coverage's.
      - name: restore Alpha and break Epsilon instead
        run: |
          set -eu
          python3 .github/ci.py restore samples/demo/src/main/java/dev/demo/Alpha.java
          python3 .github/ci.py mutate samples/demo/src/main/java/dev/demo/Epsilon.java
          python3 .github/ci.py discard samples/demo

      - name: run only the tests the second change can reach
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      - name: the registry's test ran and failed, the unrelated ones did not
        run: YORIWAKE_REQUIRE_DECISIONS=1 python3 .github/assert_selection.py --mutated epsilon
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  # A map is per operating system: one captured on another makes a selecting run run every test
  # (`environment-changed`), and these two jobs show that refusal in both directions, with the
  # change's tests run and failed. Selection on Windows itself is the Windows-to-Windows job below.
  select-on-windows:
    name: select on windows, against a map captured on linux
    needs: [changes, capture]
    if: ${{ !cancelled() && needs.changes.outputs.gradle != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Before the checkout: a clone that already dropped long-path files looks complete and cannot
      # be repaired afterwards, and a checkout's line endings are fixed when it is made. LF, as on
      # Linux, so the operating system is the only thing that differs.
      - name: allow long paths, and check out with the repository's LF line endings
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The mutated source fails its builds by design; the assertion tells what failed.
          add-job-summary: never

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-map
          path: samples/demo/.gradle/yoriwake

      # `shell: bash` on every step: the Windows runner defaults to pwsh, which would take a
      # different path (`gradlew.bat`) from every other job.
      - name: publish the plugin locally
        shell: bash
        run: ./gradlew :plugin:publishToMavenLocal --build-cache --console=plain

      - name: break Alpha so its tests fail
        shell: bash
        run: python .github/ci.py mutate samples/demo/src/main/java/dev/demo/Alpha.java

      # The mutation makes tests fail, so a non-zero exit is expected; the assertion decides the job.
      - name: run with a map from another operating system
        shell: bash
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      # YORIWAKE_REQUIRE_DECISIONS=1, which the local check also sets: without a decision record the
      # assertion silently skips its whole WHY half. Windows is where that write is most likely to
      # fail quietly, because MAX_PATH bites the `<task>-<hash>` directory the record lives in.
      - name: every test ran, because the map was recorded on another operating system
        shell: bash
        run: YORIWAKE_REQUIRE_DECISIONS=1 python .github/assert_selection.py --mutated alpha-on-another-os
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        shell: bash
        run: ./gradlew --stop

  capture-on-windows:
    name: build a map on windows
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.gradle != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 15
    # The JDK the map was captured on, for the job that selects against it on the same OS.
    outputs:
      jdk: ${{ steps.jdk.outputs.version }}
    steps:
      # Git for Windows' default, as on a developer's machine: tracked text, the demo's resources
      # included, is checked out with CRLF. The selecting job below checks out LF, so its map
      # crosses line endings and must still narrow.
      - name: allow long paths, and check out with CRLF line endings
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        id: java
        with:
          distribution: temurin
          java-version: '21'
          # Windows images ship JDKs Temurin does not publish (`21.0.12+101`), which the selecting
          # job, on another image, cannot install: take the latest Temurin release instead.
          check-latest: true
      # On Windows setup-java reports the JDK as `21.0.13+9.0`, a version it refuses as input.
      - name: the JDK, as setup-java takes it back
        id: jdk
        shell: bash
        run: |
          version='${{ steps.java.outputs.version }}'
          [[ $version == *+*.0 ]] && version=${version%.0}
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          add-job-summary: on-failure

      - name: publish the plugin locally
        shell: bash
        run: ./gradlew :plugin:publishToMavenLocal --build-cache --console=plain

      - name: run the sample suite, capturing coverage
        shell: bash
        run: ./gradlew -p samples/demo test -Pyoriwake.isolatedCapture --console=plain

      - name: check a map was actually written
        shell: bash
        run: |
          set -eu
          map=$(python .github/ci.py find-map samples/demo)
          grep -q "dev.demo.Alpha" "$map"

      # The select jobs of this run read it; a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-map-windows
          path: samples/demo/.gradle/yoriwake
          include-hidden-files: true
          retention-days: 1
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        shell: bash
        run: ./gradlew --stop

  # Selection on Windows, on another runner from a cold checkout, as `select` is on Linux. Its
  # checkout is LF and the map's capture was CRLF.
  select-on-windows-from-windows:
    name: select on windows, against a map captured on windows
    needs: [changes, capture-on-windows]
    if: ${{ !cancelled() && needs.changes.outputs.gradle != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: allow long paths, and check out with the repository's LF line endings
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The map's JDK: another patch release would rightly run every test.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ needs.capture-on-windows.outputs.jdk }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The mutated source fails its builds by design; the assertion tells what failed.
          add-job-summary: never

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-map-windows
          path: samples/demo/.gradle/yoriwake

      - name: publish the plugin locally
        shell: bash
        run: ./gradlew :plugin:publishToMavenLocal --build-cache --console=plain

      - name: break Alpha so its tests fail
        shell: bash
        run: python .github/ci.py mutate samples/demo/src/main/java/dev/demo/Alpha.java

      - name: run only the tests the change can reach
        shell: bash
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      - name: the change's own tests ran and failed, the unrelated ones did not
        shell: bash
        run: YORIWAKE_REQUIRE_DECISIONS=1 python .github/assert_selection.py

      - name: restore Alpha and break Epsilon instead
        shell: bash
        run: |
          set -eu
          python .github/ci.py restore samples/demo/src/main/java/dev/demo/Alpha.java
          python .github/ci.py mutate samples/demo/src/main/java/dev/demo/Epsilon.java
          python .github/ci.py discard samples/demo

      - name: run only the tests the second change can reach
        shell: bash
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      - name: the registry's test ran and failed, the unrelated ones did not
        shell: bash
        run: YORIWAKE_REQUIRE_DECISIONS=1 python .github/assert_selection.py --mutated epsilon
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        shell: bash
        run: ./gradlew --stop

  select-on-linux:
    name: select on linux, against a map captured on windows
    needs: [changes, capture-on-windows]
    if: ${{ !cancelled() && needs.changes.outputs.gradle != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The mutated source fails its builds by design; the assertion tells what failed.
          add-job-summary: never

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-map-windows
          path: samples/demo/.gradle/yoriwake

      - name: publish the plugin locally
        run: ./gradlew :plugin:publishToMavenLocal --build-cache --console=plain

      - name: break Alpha so its tests fail
        run: python3 .github/ci.py mutate samples/demo/src/main/java/dev/demo/Alpha.java

      - name: run with a map from another operating system
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      - name: every test ran, because the map was recorded on another operating system
        run: YORIWAKE_REQUIRE_DECISIONS=1 python3 .github/assert_selection.py --mutated alpha-on-another-os
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  # The unit and agent suites on Windows. The checkout keeps the runner's CRLF line endings, as a
  # Windows developer's does; .gitattributes pins the files that cannot take them. They run without
  # the functional coverage, whose gate is Linux's.
  # The functional suites run on Windows only in matrix.yml, in each release check: they were most
  # of this workflow's runner time and its longest wait for a runner, and a Windows-only failure of
  # theirs is rare enough for the release to find.
  build-windows:
    name: unit and agent suites on windows
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.unit != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          add-job-summary: on-failure
      - shell: bash
        run: ./gradlew build -x functionalTest -x functionalTestGradle9 -Pyoriwake.functional.coverage=false --continue --build-cache --console=plain
      # A person reads it when the Windows unit build failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results-windows-unit
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 7
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        shell: bash
        run: ./gradlew --stop

  # The run's one summary: each job's result, each functional suite's tests and what failed
  # (.github/run_summary.py). It reports and gates nothing, so no required check is on it.
  run-summary:
    name: run summary
    needs: [changes, build, maven-shard, maven, functional-shard, functional, functional-gradle9-shard, functional-gradle9,
            gradle-seed, coverage, capture, select, select-on-windows, capture-on-windows,
            select-on-windows-from-windows, select-on-linux, build-windows]
    if: always() && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: functional-*
          path: results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          path: results
      # Through the environment, never spliced into the script.
      - name: write the run's summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/run_summary.py .github/workflows/verify.yml results
