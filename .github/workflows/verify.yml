name: verify

# Builds and tests the plugin, then checks the thing a local run cannot: that a coverage map built
# on one machine selects correctly on another, from a cold checkout.
# A pull request that changes only Markdown or docs runs nothing but the `changes` job, and every
# other job reports skipped, which satisfies the required checks; docs/contract.md (the agent's
# tests check its constants against it, the plugin's its published tokens), docs/reference.md (the
# plugin's tests check the names, flags and printed lines it quotes against the code, test_ci.py its
# supported matrix against matrix.yml) and SECURITY.md (test_ci.py checks its key fingerprint
# against RELEASE-KEY.asc) count as code. A push to main keeps the path filter.
on:
  push:
    branches: [main]
    paths: ['**', '!**/*.md', '!docs/**', 'docs/contract.md', 'docs/reference.md', 'SECURITY.md']
  # Only pull requests into main: a docs-only pull request into another branch, retargeted to main,
  # must not bring its skipped checks along. Retargeted, its required checks are missing until a push.
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Every push to main runs on its own, so no
# merge goes unchecked.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Read-only, no secrets, and triggered by pull_request rather than pull_request_target, so a
# fork's code cannot reach anything.
permissions:
  contents: read

# The build runs on Gradle 8.14, the supported floor, on purpose (CONTRIBUTING.md); turning off
# setup-gradle's build capture is the action's only way to drop its "out of date" notice.
env:
  GRADLE_ACTIONS_SKIP_BUILD_RESULT_CAPTURE: 'true'

# The build in parallel jobs, split by task, and each functional suite further by test class into
# shards: together they run everything `./gradlew build` runs, and the slowest shard sets the time.
# A check job per suite, named as the suite, proves every test class ran in exactly one shard.
jobs:
  # Whether this run needs the build at all. A pull request that changes only docs skips every job
  # below, and a skipped job satisfies a required check, where a path filter on the trigger would
  # leave the required checks waiting forever. The jobs run unless this says `false`, so a detector
  # that failed or said nothing runs everything: a wrong "docs only" would skip every check.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            echo "code=$(python3 .github/ci.py needs-checks "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: unit and agent suites
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The plugin's coverage gate needs the functional suites, which run in the shards below; the
      # coverage job gates on this job's unit-test data and theirs.
      - run: ./gradlew build :agent:jacocoTestReport -x functionalTest -x functionalTestGradle9 -Pyoriwake.functional.coverage=false --console=plain
      - run: python3 .github/test_ci.py
      - name: the release's signing and upload refusal work
        run: .github/check_release_signing.sh
      # The coverage job reads it; kept a day: a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux-unit
          path: plugin/build/jacoco/test.exec
          if-no-files-found: error
          retention-days: 1
      # The agent's measured coverage, so a ratchet is set from this run without another.
      # A person reads it: setting a ratchet from a green pull request's run, or reading a red gate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-report-agent
          path: agent/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn
          retention-days: 7
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  functional-shard:
    name: functional on Gradle 8.14 (shard ${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - shell: bash
        run: ./gradlew :plugin:functionalTest -x functionalTestGradle9 -Pyoriwake.functional.shard=${{ matrix.shard }}/2 --continue --console=plain
      # A flake leaves nothing to diagnose once the runner is gone: what each TestKit home
      # downloaded, which tells a dependency that never arrived from one that could not be
      # read, and the homes' daemon logs.
      - name: list what the TestKit homes downloaded
        if: failure()
        shell: bash
        run: python3 .github/ci.py list-test-kit-homes plugin/build/tmp > plugin/build/test-kit-homes.txt
      # A person reads it to see what a failed shard's TestKit daemons downloaded and logged.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-kit-homes-linux-functionalTest-${{ matrix.shard }}-of-2
          path: |
            plugin/build/test-kit-homes.txt
            plugin/build/tmp/*/work/.gradle-test-kit-*/daemon/**/*.log
            plugin/build/tmp/*/work/.gradle-test-kit-*/test-kit-daemon/**/*.log
          include-hidden-files: true
          retention-days: 7
      # Always, and an error when empty: the check below reads every shard's results.
      # Kept a day: a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: functional-linux-functionalTest-${{ matrix.shard }}-of-2
          path: plugin/build/test-results/functionalTest/*.xml
          if-no-files-found: error
          retention-days: 1
      # The daemons' coverage and the test JVM's own, for the coverage job.
      # Kept a day: a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-linux-functionalTest-${{ matrix.shard }}-of-2
          path: plugin/build/jacoco/
          if-no-files-found: error
          retention-days: 1
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  # Named as the unsharded job was, and the check that is required: every shard succeeded and
  # every test class the sources declare ran in exactly one of them.
  functional:
    name: functional on Gradle 8.14
    needs: [changes, functional-shard]
    if: always() && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: every shard succeeded
        if: needs.functional-shard.result != 'success'
        run: |
          echo "a shard of functional on Gradle 8.14 did not succeed: ${{ needs.functional-shard.result }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: functional-linux-functionalTest-*
          path: shards
      - name: every test class ran in exactly one shard
        run: python3 .github/functional_shards.py check shards --count 2

  functional-gradle9-shard:
    name: functional on Gradle 9 (shard ${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - shell: bash
        run: ./gradlew :plugin:functionalTestGradle9 -Pyoriwake.functional.shard=${{ matrix.shard }}/2 --continue --console=plain
      # A flake leaves nothing to diagnose once the runner is gone: what each TestKit home
      # downloaded, which tells a dependency that never arrived from one that could not be
      # read, and the homes' daemon logs.
      - name: list what the TestKit homes downloaded
        if: failure()
        shell: bash
        run: python3 .github/ci.py list-test-kit-homes plugin/build/tmp > plugin/build/test-kit-homes.txt
      # A person reads it to see what a failed shard's TestKit daemons downloaded and logged.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-kit-homes-linux-functionalTestGradle9-${{ matrix.shard }}-of-2
          path: |
            plugin/build/test-kit-homes.txt
            plugin/build/tmp/*/work/.gradle-test-kit-*/daemon/**/*.log
            plugin/build/tmp/*/work/.gradle-test-kit-*/test-kit-daemon/**/*.log
          include-hidden-files: true
          retention-days: 7
      # Always, and an error when empty: the check below reads every shard's results.
      # Kept a day: a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: functional-linux-functionalTestGradle9-${{ matrix.shard }}-of-2
          path: plugin/build/test-results/functionalTestGradle9/*.xml
          if-no-files-found: error
          retention-days: 1
      # The daemons' coverage and the test JVM's own, for the coverage job.
      # Kept a day: a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-linux-functionalTestGradle9-${{ matrix.shard }}-of-2
          path: plugin/build/jacoco/
          if-no-files-found: error
          retention-days: 1
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  # Named as the unsharded job was, and the check that is required: every shard succeeded and
  # every test class the sources declare ran in exactly one of them.
  functional-gradle9:
    name: functional on Gradle 9
    needs: [changes, functional-gradle9-shard]
    if: always() && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: every shard succeeded
        if: needs.functional-gradle9-shard.result != 'success'
        run: |
          echo "a shard of functional on Gradle 9 did not succeed: ${{ needs.functional-gradle9-shard.result }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: functional-linux-functionalTestGradle9-*
          path: shards
      - name: every test class ran in exactly one shard
        run: python3 .github/functional_shards.py check shards --count 2

  # The plugin's coverage gate over the unit tests and every Linux shard of both functional suites,
  # as `./gradlew build` gates locally. The report goes up unless the run was cancelled, so a ratchet
  # is set and a red gate read from this run without another.
  coverage:
    name: coverage gate
    needs: [changes, build, functional-shard, functional-gradle9-shard]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-linux-*
          path: coverage-data
      - run: ./gradlew :plugin:jacocoTestReport :plugin:jacocoTestCoverageVerification -Pyoriwake.coverage.data=coverage-data --continue --console=plain
      # The gate must refuse rather than pass on the unit tests alone: given only their data, it
      # fails and names both functional suites.
      - name: the gate refuses missing functional data
        run: |
          mkdir unit-only
          cp coverage-data/coverage-linux-unit/test.exec unit-only/
          if ./gradlew :plugin:jacocoTestCoverageVerification -Pyoriwake.coverage.data=unit-only --console=plain > refusal.log 2>&1; then
            cat refusal.log
            echo "the coverage gate passed with no functional data"
            exit 1
          fi
          grep -q "no daemon coverage from functionalTest and functionalTestGradle9" refusal.log || { cat refusal.log; exit 1; }
      # A person reads it: setting a ratchet from a green pull request's run, or reading a red gate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-report-plugin
          path: |
            plugin/build/reports/jacoco/test/jacocoTestReport.xml
            coverage-data/**/summary.txt
          if-no-files-found: warn
          retention-days: 7
      # A person reads it when the coverage gate failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: coverage-report-plugin-html
          path: plugin/build/reports/jacoco/test/html/
          retention-days: 7
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  capture:
    name: build a map
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: publish the plugin locally
        run: ./gradlew :plugin:publishToMavenLocal --console=plain

      # Isolated, one test JVM per test class: the sample's classes all run in one JVM, so a shared
      # capture keeps every test that ran after the changed class first loaded, and the selection
      # below could not show that unrelated tests are skipped.
      - name: run the sample suite, capturing coverage
        run: ./gradlew -p samples/demo test -Pyoriwake.isolatedCapture --console=plain

      # Not `find`: it does not exist on the Windows runner, and this step has to read the same on
      # every operating system the workflow crosses. `.github/ci.py` is the one interpreter
      # every job already needs, because assert_selection.py decides them.
      - name: check a map was actually written
        shell: bash
        run: |
          set -eu
          map=$(python3 .github/ci.py find-map samples/demo)
          grep -q "dev.demo.Alpha" "$map"

      # The select jobs of this run read it; a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-map
          path: samples/demo/.gradle/yoriwake
          include-hidden-files: true
          retention-days: 1
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  select:
    name: select on another machine
    needs: [changes, capture]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      # A fresh checkout on a different runner, with no build outputs and no map of its own. This is
      # the CI shape: restore the map, change something, run only what the change can reach.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-map
          path: samples/demo/.gradle/yoriwake

      - name: publish the plugin locally
        run: ./gradlew :plugin:publishToMavenLocal --console=plain

      # Not `sed -i`: its flags differ between GNU and BSD, Windows has neither, and `sed` exits 0
      # when nothing matches. ci.py refuses a mutation that did not apply.
      - name: break Alpha so its tests fail
        shell: bash
        run: |
          set -eu
          python3 .github/ci.py mutate samples/demo/src/main/java/dev/demo/Alpha.java
          git diff --name-only

      # The mutation makes tests fail, so a non-zero exit is expected here; the assertion below
      # is what decides the job. Gradle's own failure is still visible in the log.
      - name: run only the tests the change can reach
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      - name: the change's own tests ran and failed, the unrelated ones did not
        run: YORIWAKE_REQUIRE_DECISIONS=1 python3 .github/assert_selection.py

      # A class only a resource names: nothing in bytecode leads from it to its test, so this
      # round is the resource scan's, where the first was coverage's.
      - name: restore Alpha and break Epsilon instead
        run: |
          set -eu
          python3 .github/ci.py restore samples/demo/src/main/java/dev/demo/Alpha.java
          python3 .github/ci.py mutate samples/demo/src/main/java/dev/demo/Epsilon.java
          python3 .github/ci.py discard samples/demo

      - name: run only the tests the second change can reach
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      - name: the registry's test ran and failed, the unrelated ones did not
        run: YORIWAKE_REQUIRE_DECISIONS=1 python3 .github/assert_selection.py --mutated epsilon
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  # A map is per operating system: one captured on another makes a selecting run run every test
  # (`environment-changed`), and these two jobs show that refusal in both directions, with the
  # change's tests run and failed. Selection on Windows itself is the Windows-to-Windows job below.
  select-on-windows:
    name: select on windows, against a map captured on linux
    needs: [changes, capture]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      # Before the checkout: a clone that already dropped long-path files looks complete and cannot
      # be repaired afterwards, and a checkout's line endings are fixed when it is made. LF, as on
      # Linux, so the operating system is the only thing that differs.
      - name: allow long paths, and check out with the repository's LF line endings
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-map
          path: samples/demo/.gradle/yoriwake

      # `shell: bash` on every step: the Windows runner defaults to pwsh, which would take a
      # different path (`gradlew.bat`) from every other job.
      - name: publish the plugin locally
        shell: bash
        run: ./gradlew :plugin:publishToMavenLocal --console=plain

      - name: break Alpha so its tests fail
        shell: bash
        run: python .github/ci.py mutate samples/demo/src/main/java/dev/demo/Alpha.java

      # The mutation makes tests fail, so a non-zero exit is expected; the assertion decides the job.
      - name: run with a map from another operating system
        shell: bash
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      # YORIWAKE_REQUIRE_DECISIONS=1, which the local check also sets: without a decision record the
      # assertion silently skips its whole WHY half. Windows is where that write is most likely to
      # fail quietly, because MAX_PATH bites the `<task>-<hash>` directory the record lives in.
      - name: every test ran, because the map was recorded on another operating system
        shell: bash
        run: YORIWAKE_REQUIRE_DECISIONS=1 python .github/assert_selection.py --mutated alpha-on-another-os
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        shell: bash
        run: ./gradlew --stop

  capture-on-windows:
    name: build a map on windows
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - name: allow long paths, and check out with the repository's LF line endings
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: publish the plugin locally
        shell: bash
        run: ./gradlew :plugin:publishToMavenLocal --console=plain

      - name: run the sample suite, capturing coverage
        shell: bash
        run: ./gradlew -p samples/demo test -Pyoriwake.isolatedCapture --console=plain

      - name: check a map was actually written
        shell: bash
        run: |
          set -eu
          map=$(python .github/ci.py find-map samples/demo)
          grep -q "dev.demo.Alpha" "$map"

      # The select jobs of this run read it; a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-map-windows
          path: samples/demo/.gradle/yoriwake
          include-hidden-files: true
          retention-days: 1
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        shell: bash
        run: ./gradlew --stop

  # Selection on Windows, on another runner from a cold checkout, as `select` is on Linux.
  select-on-windows-from-windows:
    name: select on windows, against a map captured on windows
    needs: [changes, capture-on-windows]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - name: allow long paths, and check out with the repository's LF line endings
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-map-windows
          path: samples/demo/.gradle/yoriwake

      - name: publish the plugin locally
        shell: bash
        run: ./gradlew :plugin:publishToMavenLocal --console=plain

      - name: break Alpha so its tests fail
        shell: bash
        run: python .github/ci.py mutate samples/demo/src/main/java/dev/demo/Alpha.java

      - name: run only the tests the change can reach
        shell: bash
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      - name: the change's own tests ran and failed, the unrelated ones did not
        shell: bash
        run: YORIWAKE_REQUIRE_DECISIONS=1 python .github/assert_selection.py

      - name: restore Alpha and break Epsilon instead
        shell: bash
        run: |
          set -eu
          python .github/ci.py restore samples/demo/src/main/java/dev/demo/Alpha.java
          python .github/ci.py mutate samples/demo/src/main/java/dev/demo/Epsilon.java
          python .github/ci.py discard samples/demo

      - name: run only the tests the second change can reach
        shell: bash
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      - name: the registry's test ran and failed, the unrelated ones did not
        shell: bash
        run: YORIWAKE_REQUIRE_DECISIONS=1 python .github/assert_selection.py --mutated epsilon
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        shell: bash
        run: ./gradlew --stop

  select-on-linux:
    name: select on linux, against a map captured on windows
    needs: [changes, capture-on-windows]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-map-windows
          path: samples/demo/.gradle/yoriwake

      - name: publish the plugin locally
        run: ./gradlew :plugin:publishToMavenLocal --console=plain

      - name: break Alpha so its tests fail
        run: python3 .github/ci.py mutate samples/demo/src/main/java/dev/demo/Alpha.java

      - name: run with a map from another operating system
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      - name: every test ran, because the map was recorded on another operating system
        run: YORIWAKE_REQUIRE_DECISIONS=1 python3 .github/assert_selection.py --mutated alpha-on-another-os
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        run: ./gradlew --stop

  # The build on Windows, split as on Linux so the slowest suite sets the time. The checkout keeps
  # the runner's CRLF line endings, as a Windows developer's does; .gitattributes pins the files
  # that cannot take them.
  # Windows runs every suite without the functional coverage: the gate is Linux's, and these jobs
  # prove on every pull request that the suites pass with no coverage runtime in the daemons.
  build-windows:
    name: unit and agent suites on windows
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - name: allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - shell: bash
        run: ./gradlew build -x functionalTest -x functionalTestGradle9 -Pyoriwake.functional.coverage=false --continue --console=plain
      # A person reads it when the Windows unit build failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results-windows-unit
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 7
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        shell: bash
        run: ./gradlew --stop

  functional-windows-shard:
    name: functional on Gradle 8.14 on windows (shard ${{ matrix.shard }}/8)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - shell: bash
        run: ./gradlew :plugin:functionalTest -x functionalTestGradle9 -Pyoriwake.functional.shard=${{ matrix.shard }}/8 -Pyoriwake.functional.coverage=false --continue --console=plain
      # A flake leaves nothing to diagnose once the runner is gone: what each TestKit home
      # downloaded, which tells a dependency that never arrived from one that could not be
      # read, and the homes' daemon logs.
      - name: list what the TestKit homes downloaded
        if: failure()
        shell: bash
        run: python .github/ci.py list-test-kit-homes plugin/build/tmp > plugin/build/test-kit-homes.txt
      # A person reads it to see what a failed shard's TestKit daemons downloaded and logged.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-kit-homes-windows-functionalTest-${{ matrix.shard }}-of-8
          path: |
            plugin/build/test-kit-homes.txt
            plugin/build/tmp/*/work/.gradle-test-kit-*/daemon/**/*.log
            plugin/build/tmp/*/work/.gradle-test-kit-*/test-kit-daemon/**/*.log
          include-hidden-files: true
          retention-days: 7
      # Always, and an error when empty: the check below reads every shard's results.
      # Kept a day: a re-run after a day needs "Re-run all jobs".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: functional-windows-functionalTest-${{ matrix.shard }}-of-8
          path: plugin/build/test-results/functionalTest/*.xml
          if-no-files-found: error
          retention-days: 1
      # Last: with build capture off, setup-gradle no longer stops the daemons before saving the
      # cache, and a live daemon's files can lock a Windows save.
      - name: stop the Gradle daemons before the cache is saved
        if: always()
        shell: bash
        run: ./gradlew --stop

  # Named as the unsharded job was, and the check that is required: every shard succeeded and
  # every test class the sources declare ran in exactly one of them.
  functional-windows:
    name: functional on Gradle 8.14 on windows
    needs: [changes, functional-windows-shard]
    if: always() && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: every shard succeeded
        if: needs.functional-windows-shard.result != 'success'
        run: |
          echo "a shard of functional on Gradle 8.14 on windows did not succeed: ${{ needs.functional-windows-shard.result }}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: functional-windows-functionalTest-*
          path: shards
      - name: every test class ran in exactly one shard
        run: python3 .github/functional_shards.py check shards --count 8

