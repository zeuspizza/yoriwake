name: supported matrix

# Runs the functional suite on every Gradle, daemon JDK and operating system the reference's
# supported matrix names, on one release candidate. A row of that table stands only on a green run
# of this workflow on the commit the release is tagged from; `.github/test_ci.py` keeps the table
# and the cell list below in step.
#
# Nightly on `main`, testing its head, so a cell a change breaks is an open issue the next morning
# rather than news on release night; a failed scheduled run opens that issue. A scheduled workflow
# that sees no repository activity for 60 days is disabled by GitHub; the release checklist checks it
# is on. Dispatched from the candidate's own branch (`main` for a minor, `release/<major>.<minor>`
# for a patch), so the workflow, the build and the table come from one line of history. It costs
# hours of runner time, which is why no push or pull request starts it.
on:
  # 23:41 UTC: the run and its issue land overnight in Europe, and a run of usual length ends before
  # guards.yml's nightly run starts, so the two do not compete for the plan's concurrent jobs.
  schedule:
    - cron: '41 23 * * *'
  workflow_dispatch:
    inputs:
      candidate:
        description: The full commit SHA of the release candidate
        required: true

permissions:
  contents: read

# The build runs on Gradle 8.14, the supported floor, on purpose (CONTRIBUTING.md); turning off
# setup-gradle's build capture is the action's only way to drop its "out of date" notice.
env:
  GRADLE_ACTIONS_SKIP_BUILD_RESULT_CAPTURE: 'true'

jobs:
  candidate:
    name: the candidate is on this branch
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Through the environment, never spliced into the script: the input is free text. A
      # scheduled run has no input and tests the head it runs on; a dispatch must still name one.
      - name: check the candidate
        id: check
        env:
          CANDIDATE: ${{ github.event_name == 'schedule' && github.sha || inputs.candidate }}
        run: |
          set -eu
          # The gate's own steps come from this branch, not from the candidate, so only a release
          # line may run it.
          case "$GITHUB_REF_NAME" in
            main|release/*) ;;
            *) echo "dispatch from main or a release/<major>.<minor> branch, not $GITHUB_REF_NAME"; exit 1 ;;
          esac
          if ! printf '%s' "$CANDIDATE" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "candidate must be a full 40-character commit SHA, got: $CANDIDATE"; exit 1
          fi
          git merge-base --is-ancestor "$CANDIDATE" HEAD || {
            echo "$CANDIDATE is not reachable from $GITHUB_REF_NAME"; exit 1
          }
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"

  # One job per cell, written out rather than generated, so the table check can read them. The
  # yoriwake build itself runs on JDK 21 and Gradle's wrapper; the cell's JDK is the daemon its
  # functional builds run on.
  cell:
    name: ${{ matrix.cell.os }} / Gradle ${{ matrix.cell.gradle }} / JDK ${{ matrix.cell.jdk }}
    needs: candidate
    runs-on: ${{ matrix.cell.runner }}
    # Twice the estimate until a candidate's run measures it; a hung cell stops here, not at six hours.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        cell:
          - { os: linux, runner: ubuntu-24.04, gradle: '8.14', task: functionalTest, jdk: '21' }
          - { os: linux, runner: ubuntu-24.04, gradle: '9.8.0', task: functionalTestGradle9, jdk: '21' }
          - { os: linux, runner: ubuntu-24.04, gradle: '9.8.0', task: functionalTestGradle9, jdk: '25' }
          - { os: macos, runner: macos-latest, gradle: '8.14', task: functionalTest, jdk: '21' }
          - { os: macos, runner: macos-latest, gradle: '9.8.0', task: functionalTestGradle9, jdk: '21' }
          - { os: macos, runner: macos-latest, gradle: '9.8.0', task: functionalTestGradle9, jdk: '25' }
          - { os: windows, runner: windows-latest, gradle: '8.14', task: functionalTest, jdk: '21' }
          - { os: windows, runner: windows-latest, gradle: '9.8.0', task: functionalTestGradle9, jdk: '21' }
          - { os: windows, runner: windows-latest, gradle: '9.8.0', task: functionalTestGradle9, jdk: '25' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      # Every JDK the test-JVM range test asks a toolchain for; the last is the build's own.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            11
            17
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          add-job-summary: on-failure

      # Only the JDKs installed above and the runner's own, by path: auto-detection misses the
      # runner's tool cache, and a JDK found anywhere else would not be the one the cell names.
      - name: build, with this cell's functional suite only
        shell: bash
        env:
          TASK: ${{ matrix.cell.task }}
          JDK: ${{ matrix.cell.jdk }}
        run: |
          set -eu
          homes=$(printenv | grep -Ei '^JAVA_HOME_[0-9]+_(x64|arm64)=' | cut -d= -f2- | paste -sd, -)
          py=python3; if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          # A dependency download that fails in transit costs a rerun, not the cell.
          "$py" .github/ci.py rerun-on-download-failure -- ./gradlew build --console=plain \
            -Pyoriwake.functional.gradle="$TASK" -Pyoriwake.functional.jdk="$JDK" \
            -Porg.gradle.java.installations.auto-detect=false \
            -Porg.gradle.java.installations.paths="$homes"

      - name: collect the cell's results
        if: always()
        shell: bash
        run: |
          set -eu
          mkdir cell-results
          git rev-parse HEAD > cell-results/sha.txt
          cp -R plugin/build/test-results/functionalTest* cell-results/ || true

      # The summary reads every cell. A re-run of a failed cell, possible for 30 days, re-runs
      # it, so every matrix artifact lasts as long as that.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cell-${{ matrix.cell.os }}-${{ matrix.cell.gradle }}-${{ matrix.cell.jdk }}
          path: cell-results
          retention-days: 30

  # A map captured on one operating system, selected against on another, from a cold checkout of
  # the candidate: the shape a CI cache gives a map.
  capture:
    name: build a map on ${{ matrix.os }}
    needs: candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04 }
          - { os: macos, runner: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          add-job-summary: on-failure

      - name: publish the plugin locally
        run: ./gradlew :plugin:publishToMavenLocal --console=plain

      # Isolated, one test JVM per test class, as in verify.yml: so the selection shows that
      # unrelated tests are skipped.
      - name: run the sample suite, capturing coverage
        run: ./gradlew -p samples/demo test -Pyoriwake.isolatedCapture --console=plain

      - name: check a map was actually written
        shell: bash
        run: |
          set -eu
          map=$(python3 .github/ci.py find-map samples/demo)
          grep -q "dev.demo.Alpha" "$map"
          mkdir job-sha
          git rev-parse HEAD > job-sha/sha.txt

      # The select jobs read it. "Re-run failed jobs" on a failed select does not re-run its
      # capture, so it lasts as long as a re-run can come.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-map-${{ matrix.os }}
          path: samples/demo/.gradle/yoriwake
          include-hidden-files: true
          retention-days: 30

      # The summary reads it, with the cells, for as long as a cell can be re-run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha-capture-${{ matrix.os }}
          path: job-sha
          retention-days: 30

  select:
    name: select on ${{ matrix.os }}, against a map captured on ${{ matrix.from }}
    needs: [candidate, capture]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { from: linux, os: linux, runner: ubuntu-24.04 }
          - { from: linux, os: macos, runner: macos-latest }
          - { from: macos, os: linux, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          # The mutated source fails its builds by design; the assertion tells what failed.
          add-job-summary: never

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-map-${{ matrix.from }}
          path: samples/demo/.gradle/yoriwake

      - name: publish the plugin locally
        run: ./gradlew :plugin:publishToMavenLocal --console=plain

      - name: break Alpha so its tests fail
        shell: bash
        run: python3 .github/ci.py mutate samples/demo/src/main/java/dev/demo/Alpha.java

      # The mutation makes tests fail, so a non-zero exit is expected; the assertion decides the job.
      - name: run only the tests the change can reach
        run: ./gradlew -p samples/demo test -Pyoriwake.select --console=plain || true

      # A map is per operating system: from another, the run must refuse it and run everything.
      - name: the change's own tests ran and failed, the unrelated ones did not
        env:
          EXPECT: ${{ matrix.from == matrix.os && 'alpha' || 'alpha-on-another-os' }}
        run: YORIWAKE_REQUIRE_DECISIONS=1 python3 .github/assert_selection.py --mutated "$EXPECT"

      - name: record the commit this job ran
        shell: bash
        run: |
          mkdir job-sha
          git rev-parse HEAD > job-sha/sha.txt

      # The summary reads it, with the cells, for as long as a cell can be re-run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha-select-${{ matrix.from }}-on-${{ matrix.os }}
          path: job-sha
          retention-days: 30

  # Green only if every cell ran its label's Gradle and JDK, ran the same tests as the reference
  # cell with no skip the allowlist does not name, every table row's proving tests passed in the
  # cells the row names, and every job ran the candidate.
  summary:
    name: every cell ran what its label says
    needs: [candidate, cell, select]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
      - name: check every cell
        env:
          CANDIDATE: ${{ needs.candidate.outputs.sha }}
        run: python3 .github/matrix_check.py results results --candidate "$CANDIDATE"

  # Only a scheduled run has nobody watching it; a dispatched one is read by whoever started it. The
  # issue names the jobs that did not succeed, so the red cell is readable without opening the run;
  # a failure only the summary finds names the summary, whose log names the cell.
  report-failure:
    needs: [candidate, cell, capture, select, summary]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Scheduled supported-matrix run failed
        run: |
          set -u
          # A listing that fails still leaves the run's link in the issue.
          failed=$(gh run view "$RUN" -R "$REPO" --json jobs --jq '.jobs[]
            | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped")
            | "- \(.name): \(.conclusion)"') || failed=""
          { echo "$URL"; [ -z "$failed" ] || printf '\nJobs that did not succeed:\n%s\n' "$failed"; } > body.md
          # One issue per failure rather than per night: while one with this title is open, a failed
          # night comments on it. A listing that fails opens a new one.
          open=$(gh issue list -R "$REPO" --state open --author app/github-actions --search "in:title $TITLE" \
            --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -1) || open=""
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$REPO" --body-file body.md
          else
            gh issue create -R "$REPO" --title "$TITLE" --body-file body.md
          fi

  # The run's one summary: each job's result, each cell's tests and what failed
  # (.github/run_summary.py). It reports and gates nothing; the check above is the summary job.
  run-summary:
    name: run summary
    needs: [candidate, cell, capture, select, summary, report-failure]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # The script and this file as this run has them, not the candidate's: a candidate older
      # than the script has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cell-*
          path: results
      # Through the environment, never spliced into the script.
      - name: write the run's summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/run_summary.py .github/workflows/matrix.yml results
