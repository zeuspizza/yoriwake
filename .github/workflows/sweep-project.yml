name: sweep-project

# One project of a sweep (sweep.yml calls it once per project): its record job, then one job per
# slice of its accepted target list and, beside them, the replay of its last real commits. A
# project's slices wait for its own record job only, so a slow project's record does not hold back
# the others' slices, and a replay that fails or loses its runner costs that figure alone. The
# merge, in sweep.yml, reads what these jobs upload.
#
# With `isolated` at `paired` the record job also records the project's map a second time, with a
# fresh test JVM per class, and each slice measures its rows against that map once their shared arms
# are done. Both are extra: neither can cost the project a shared row.
#
# With `budget` at `paired` the record job also records a third map with
# `-Pyoriwake.isolatedCaptureBudget=2x`, over the shared one before the isolated recording discards
# it, and each slice measures its rows against that map last. Extra in the same way.
on:
  workflow_call:
    inputs:
      project:
        description: the project's entry of the plan, as JSON
        type: string
        required: true
      factor:
        description: runner seconds per local second, for a project priced from local times
        type: string
        default: ''
      commits:
        description: real commits to replay per project after its record, 0 for none
        type: string
        default: '8'
      replay_only:
        description: record and replay the commits, measure no slice
        type: boolean
        default: false
      isolated:
        description: paired also measures each row against an isolated map
        type: string
        default: 'off'
      budget:
        description: paired also measures each row against a map recorded within a 2x budget
        type: string
        default: 'off'

permissions:
  contents: read
  packages: read

# The build runs on Gradle 8.14, the supported floor, on purpose (CONTRIBUTING.md); turning off
# setup-gradle's build capture is the action's only way to drop its "out of date" notice.
env:
  GRADLE_ACTIONS_SKIP_BUILD_RESULT_CAPTURE: 'true'

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # A guest may resolve dependencies from GitHub Packages, which takes a token even for a public
    # package: bitwarden-android's SDK. Read-only, and handed to that project's build alone below.
    # The artifacts of earlier runs, for the dependency pack an earlier sweep left.
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      shards: ${{ steps.record.outputs.shards }}
      of: ${{ steps.record.outputs.of }}
      isolated: ${{ steps.isolated-upload.outcome == 'success' }}
      budget: ${{ steps.budget-upload.outcome == 'success' }}
      deps: ${{ steps.deps-upload.outcome == 'success' && steps.deps.outputs.name || '' }}
      jdk11: ${{ steps.jdks.outputs.jdk11 }}
      jdk17: ${{ steps.jdks.outputs.jdk17 }}
      jdk25: ${{ steps.jdks.outputs.jdk25 }}
      jdk26: ${{ steps.jdks.outputs.jdk26 }}
      jdk21: ${{ steps.jdks.outputs.jdk21 }}
    env:
      # The stamp of the plugin restored below, checked instead of publishing it again.
      YORIWAKE_PUBLISHED: ~/.m2/repository/io/github/zeuspizza/published.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            11
            17
            25
            26
            21
      # The exact builds installed here, which the slices and the replay install in turn: a map
      # selected against on another build of the same JDK runs every test.
      - name: name the JDK builds
        id: jdks
        run: |
          set -euo pipefail
          for n in 11 17 25 26 21; do
            home=$(printenv "JAVA_HOME_${n}_X64")
            installed=$(basename "$(dirname "$home")")
            build=$(JAVA_HOME="$home" python3 .github/ci.py temurin-version "${installed/-/+}")
            [ -n "$build" ]
            echo "jdk$n=$build" >> "$GITHUB_OUTPUT"
          done
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          # A measured project's own failing tests fail builds here; the results tell what failed.
          add-job-summary: never
      # The plugin under test, published once for the run by sweep.yml's publish job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-under-test
          path: ~/.m2/repository/io/github/zeuspizza
      # THE DEPENDENCY PACK (bench/deps_pack.py). Every corpus job used to download its guest's
      # whole dependency tree, and a sweep's jobs together drew 429s from the guests' repositories.
      # This job starts from the pack the newest earlier sweep left for this project at this pinned
      # commit, and leaves one for its slices, its replay and the next sweep. Each of its steps may
      # fail: a job without a pack resolves as it always did. Over setup-gradle's restore.
      - name: find this project's dependency pack
        id: deps
        continue-on-error: true
        env:
          ARGS: ${{ toJSON(fromJSON(inputs.project).args) }}
          BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # What the isolated recording below may still spend is counted from here, before the
          # pack's restore, so that restore comes out of its time and not the job's last minutes.
          date +%s > "$RUNNER_TEMP/record-start"
          name=$(python3 bench/deps_pack.py name "$(jq -r '.[0]' <<< "$ARGS")")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "run=$(python3 bench/deps_pack.py find "$name" --repo "$GITHUB_REPOSITORY" --branch "$BRANCH")" >> "$GITHUB_OUTPUT"
      - if: steps.deps.outputs.run != ''
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.deps.outputs.name }}
          run-id: ${{ steps.deps.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/deps-in
      - name: restore the dependency pack
        continue-on-error: true
        timeout-minutes: 15
        run: python3 bench/deps_pack.py restore "$RUNNER_TEMP/deps-in" "$RUNNER_TEMP/deps-before.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published-rows
          # Outside the checkout: an untracked file in it makes run.py refuse the tree as dirty.
          path: ${{ runner.temp }}/published-rows
      - name: record and cut into slices
        id: record
        env:
          NAME: ${{ fromJSON(inputs.project).project }}
          ARGS: ${{ toJSON(fromJSON(inputs.project).args) }}
          GITHUB_TOKEN: ${{ fromJSON(inputs.project).project == 'bitwarden-android' && github.token || '' }}
          # Relative to bench/; another project's clone for one measured in it (detekt-junk).
          CHECKOUT: ${{ fromJSON(inputs.project).checkout }}
          FACTOR: ${{ inputs.factor }}
          ISOLATED: ${{ inputs.isolated }}
          BUDGET: ${{ inputs.budget }}
        run: |
          set -eu
          # Where the step above could not start the clock.
          [ -f "$RUNNER_TEMP/record-start" ] || date +%s > "$RUNNER_TEMP/record-start"
          # A guest's own test report on the run page is unlabelled and repeated for every build it
          # runs (anki-android's build writes one per test task); the merge job writes the page.
          unset GITHUB_STEP_SUMMARY
          # A runner that runs out of memory or disk is shut down whole, and this step's log is all
          # it leaves: the machine's use, every 30 seconds, beside the build's.
          bench/machine_sampler.sh & sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          mapfile -t args < <(jq -r '.[]' <<< "$ARGS")
          python3 bench/run.py "${args[@]}" --accepted-out "bench/logs/$NAME/accepted.json"
          # Priced from what runners measured of this project in the last published sweep, when
          # it has rows there; else from this job's own header.
          priced=()
          last="$RUNNER_TEMP/published-rows/$NAME.json"
          [ -f "$last" ] && priced=(--priced-from "$last")
          # A slice that measures its rows against both maps holds fewer of them. A Maven project
          # has one map only.
          paired=()
          build=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb")).get("build", "gradle"))' "${args[0]}")
          [ "${ISOLATED:-off}" != paired ] || [ "$build" = maven ] || paired=(--isolated)
          [ "${BUDGET:-off}" != paired ] || [ "$build" = maven ] || paired+=(--budget)
          # The dispatch input's default, for a run that has none.
          shards=$(python3 bench/shard.py "bench/logs/$NAME/accepted.json" --factor "${FACTOR:-1.5}" \
            "${priced[@]+"${priced[@]}"}" "${paired[@]+"${paired[@]}"}")
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "of=$(jq length <<< "$shards")" >> "$GITHUB_OUTPUT"
          [ "$shards" != "[]" ] || echo "::warning::$NAME was cut into no slices"
          # A tar, not the artifact's own zip, which drops the checkout's executable bits. Under the
          # project's name, because one artifact downloads without its own directory and several
          # with: readers find `<project>/accepted.json` either way. Outside the checkout, as every
          # upload of this job: an untracked file in it makes the isolated recording's run.py
          # refuse the tree as dirty.
          mkdir -p "$RUNNER_TEMP/record/$NAME"
          cp "bench/logs/$NAME/accepted.json" "$RUNNER_TEMP/record/$NAME/"
          tar -czf "$RUNNER_TEMP/record/$NAME/state.tar.gz" -C bench "logs/$NAME" "results/$NAME.json" \
            "$CHECKOUT" logs/evidence
      # Each shard, the replay and the merge read it. Three days cover a weekend re-run of a
      # sweep's failed jobs; the merge must finish before the first record expires.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-${{ fromJSON(inputs.project).project }}
          retention-days: 3
          path: ${{ runner.temp }}/record/
      # What the builds above resolved, for this project's other jobs and the next sweep at this
      # pin. Before the isolated recording, which resolves the same tree and may use the job to its
      # last minutes. The guests leave their daemons running, and a daemon writes the cache's index
      # only when it lets the cache go, so every Gradle the wrapper fetched stops its daemons first.
      - name: pack the dependencies
        id: deps-pack
        if: steps.deps.outputs.name != ''
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -eu
          for gradle in "${GRADLE_USER_HOME:-$HOME/.gradle}"/wrapper/dists/*/*/*/bin/gradle; do
            [ -x "$gradle" ] && { "$gradle" --stop --quiet || true; }
          done
          mkdir -p "$RUNNER_TEMP/deps"
          python3 bench/deps_pack.py pack "$RUNNER_TEMP/deps/deps.tar"
      # Under one name per project and pin, found by the next sweep's record job while it lasts.
      # Ninety days, the longest a public repository keeps one, as release checks are weeks apart.
      # Uncompressed: jars are compressed already.
      - if: steps.deps-pack.outcome == 'success'
        id: deps-upload
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.deps.outputs.name }}
          retention-days: 90
          compression-level: 0
          path: ${{ runner.temp }}/deps/deps.tar
      # The isolated recording below needs the disk more than the pack does.
      - if: steps.deps-pack.outcome != 'skipped'
        continue-on-error: true
        run: rm -rf "$RUNNER_TEMP/deps"
      # The map recorded again within a 2x isolated-capture budget, for the slices' third pass. Over
      # the shared map, which the plugin picks the classes to isolate from, so before the isolated
      # recording discards it; on this runner, so its seconds compare with the shared recording's.
      # A pick of no class would record shared, and run.py refuses it. The same limits as below.
      - name: record the budget map
        id: budget
        if: inputs.budget == 'paired' && !inputs.replay_only && steps.record.outputs.shards != '[]'
        continue-on-error: true
        env:
          NAME: ${{ fromJSON(inputs.project).project }}
          ARGS: ${{ toJSON(fromJSON(inputs.project).args) }}
          GITHUB_TOKEN: ${{ fromJSON(inputs.project).project == 'bitwarden-android' && github.token || '' }}
          CHECKOUT: ${{ fromJSON(inputs.project).checkout }}
        run: |
          set -eu
          unset GITHUB_STEP_SUMMARY
          toml=$(jq -r '.[0]' <<< "$ARGS")
          build=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb")).get("build", "gradle"))' "$toml")
          if [ "$build" = maven ]; then
            echo "$NAME is a Maven project, which has no isolated-capture budget"
            exit 0
          fi
          left=$(( $(cat "$RUNNER_TEMP/record-start") + 340 * 60 - $(date +%s) ))
          # The isolated recording after it keeps the time it had before this arm existed: about
          # four shared recordings (0.6.0's isolated arm took 3.3 times the shared one), and this
          # one takes at most three (2x and the pick), each with ten minutes to spare.
          capture=$(jq -r '.capture_seconds // 0 | floor' "bench/results/$NAME.json")
          cap=$(( 3 * capture + 600 ))
          left=$(( left - 4 * capture - 600 ))
          [ "$left" -le "$cap" ] || left=$cap
          if [ "$left" -lt 600 ]; then
            echo "::warning::$NAME: $((left / 60)) minutes left beside the isolated recording, too few for a budget recording"
            exit 0
          fi
          bench/machine_sampler.sh & sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          mapfile -t shapes < <(jq -r 'index("--shapes") as $at | if $at then .[$at], .[$at + 1] else empty end' <<< "$ARGS")
          code=0
          timeout --kill-after=60 "$left" python3 bench/run.py "$toml" "${shapes[@]+"${shapes[@]}"}" \
            --isolated-budget 2x --capture-only || code=$?
          if [ "$code" = 124 ] || [ "$code" = 137 ]; then
            echo "::warning::$NAME: the budget recording did not finish in $((left / 60)) minutes; its slices measure no budget arm"
            exit 0
          elif [ "$code" != 0 ]; then
            echo "::warning::$NAME: the budget recording failed (exit $code); its slices measure no budget arm"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/budget/$NAME"
          cp "bench/results/$NAME.budget.json" "$RUNNER_TEMP/budget/$NAME/recording.json"
          tar -czf "$RUNNER_TEMP/budget/$NAME/state.tar.gz" -C bench "logs/$NAME.budget" \
            "results/$NAME.budget.json" "$CHECKOUT/.gradle/yoriwake"
          echo "recorded=true" >> "$GITHUB_OUTPUT"
      # Read by the slices' third pass and the merge, as the isolated map's below.
      - if: ${{ !cancelled() && steps.budget.outputs.recorded == 'true' }}
        id: budget-upload
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budget-${{ fromJSON(inputs.project).project }}
          retention-days: 3
          path: ${{ runner.temp }}/budget/
      # The same map again with a fresh test JVM per class, for the slices' second pass: on this
      # runner, so both recordings' seconds are one machine's. Last, so the shared state and the
      # slices' list are what they are without it. It gets what the job has left and no more: a
      # job that hit its own limit would fail, and its slices would not start. The slices wait for
      # it, and a runner lost during it takes them with it: the step's own faults and its time are
      # bounded here, a runner's are not.
      - name: record the isolated map
        id: isolated
        if: inputs.isolated == 'paired' && !inputs.replay_only && steps.record.outputs.shards != '[]'
        continue-on-error: true
        env:
          NAME: ${{ fromJSON(inputs.project).project }}
          ARGS: ${{ toJSON(fromJSON(inputs.project).args) }}
          GITHUB_TOKEN: ${{ fromJSON(inputs.project).project == 'bitwarden-android' && github.token || '' }}
          CHECKOUT: ${{ fromJSON(inputs.project).checkout }}
        run: |
          set -eu
          unset GITHUB_STEP_SUMMARY
          toml=$(jq -r '.[0]' <<< "$ARGS")
          build=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb")).get("build", "gradle"))' "$toml")
          if [ "$build" = maven ]; then
            echo "$NAME is a Maven project, which has no isolated capture"
            exit 0
          fi
          # The job ends at 360 minutes; 20 are kept for packing and uploading the map.
          left=$(( $(cat "$RUNNER_TEMP/record-start") + 340 * 60 - $(date +%s) ))
          if [ "$left" -lt 600 ]; then
            echo "::warning::$NAME: $((left / 60)) minutes left in the job, too few for an isolated recording"
            exit 0
          fi
          bench/machine_sampler.sh & sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          mapfile -t shapes < <(jq -r 'index("--shapes") as $at | if $at then .[$at], .[$at + 1] else empty end' <<< "$ARGS")
          code=0
          timeout --kill-after=60 "$left" python3 bench/run.py "$toml" "${shapes[@]+"${shapes[@]}"}" \
            --isolated-capture --recapture --capture-only || code=$?
          # 124 and 137 are timeout's own: the time ran out (an out-of-memory kill of run.py also
          # exits 137 and reads as this). Anything else is run.py's refusal or fault, which its
          # last lines above name.
          if [ "$code" = 124 ] || [ "$code" = 137 ]; then
            echo "::warning::$NAME: the isolated recording did not finish in $((left / 60)) minutes; its slices measure the shared arm only"
            exit 0
          elif [ "$code" != 0 ]; then
            echo "::warning::$NAME: the isolated recording failed (exit $code); its slices measure the shared arm only"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/isolated/$NAME"
          cp "bench/results/$NAME.isolated.json" "$RUNNER_TEMP/isolated/$NAME/recording.json"
          tar -czf "$RUNNER_TEMP/isolated/$NAME/state.tar.gz" -C bench "logs/$NAME.isolated" \
            "results/$NAME.isolated.json" "$CHECKOUT/.gradle/yoriwake"
          echo "recorded=true" >> "$GITHUB_OUTPUT"
      # Its own artifact: a project without one has no isolated arm, which the merge reads from
      # its absence. Only a whole one, and the slices measure that arm only when it was uploaded: a
      # fault here costs the project that arm, never its slices.
      - if: ${{ !cancelled() && steps.isolated.outputs.recorded == 'true' }}
        id: isolated-upload
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-${{ fromJSON(inputs.project).project }}
          retention-days: 3
          path: ${{ runner.temp }}/isolated/
      # A record job that fails says why in its logs, not in the job's own output: the warm-up's
      # build error, the stalled capture's last lines. Not named record-*, which the merge reads.
      # A person reads it to see why the record job failed.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-record-${{ fromJSON(inputs.project).project }}
          retention-days: 3
          path: bench/logs/${{ fromJSON(inputs.project).project }}/*.log
      - name: say what this job downloaded
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 bench/deps_pack.py report "$RUNNER_TEMP/deps-before.json"

  shard:
    needs: record
    # A project cut into no slices measures nothing; the merge declares it missing.
    if: needs.record.outputs.shards != '[]' && !inputs.replay_only
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.record.outputs.shards) }}
    env:
      # The stamp of the plugin restored below, checked instead of publishing it again.
      YORIWAKE_PUBLISHED: ~/.m2/repository/io/github/zeuspizza/published.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            ${{ needs.record.outputs.jdk11 }}
            ${{ needs.record.outputs.jdk17 }}
            ${{ needs.record.outputs.jdk25 }}
            ${{ needs.record.outputs.jdk26 }}
            ${{ needs.record.outputs.jdk21 }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          # A measured project's own failing tests fail builds here; the results tell what failed.
          add-job-summary: never
      # The plugin under test, published once for the run by sweep.yml's publish job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-under-test
          path: ~/.m2/repository/io/github/zeuspizza
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: record-${{ fromJSON(inputs.project).project }}
          # Outside the checkout: an untracked file in it makes run.py refuse the tree as dirty.
          path: ${{ runner.temp }}/record
      # The record job's dependency pack, over setup-gradle's restore; without it, the guest
      # resolves as it always did.
      - if: needs.record.outputs.deps != ''
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.record.outputs.deps }}
          path: ${{ runner.temp }}/deps-in
      - name: restore the dependency pack
        continue-on-error: true
        timeout-minutes: 15
        run: python3 bench/deps_pack.py restore "$RUNNER_TEMP/deps-in" "$RUNNER_TEMP/deps-before.json"
      - if: needs.record.outputs.isolated == 'true'
        id: isolated
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: isolated-${{ fromJSON(inputs.project).project }}
          path: ${{ runner.temp }}/isolated
      - if: needs.record.outputs.budget == 'true'
        id: budget
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: budget-${{ fromJSON(inputs.project).project }}
          path: ${{ runner.temp }}/budget
      - name: measure this slice
        env:
          NAME: ${{ fromJSON(inputs.project).project }}
          ARGS: ${{ toJSON(fromJSON(inputs.project).args) }}
          GITHUB_TOKEN: ${{ fromJSON(inputs.project).project == 'bitwarden-android' && github.token || '' }}
          SHARD: ${{ matrix.shard }}/${{ needs.record.outputs.of }}
        run: |
          set -eu
          # What the second pass below may still spend is counted from here.
          date +%s > "$RUNNER_TEMP/slice-start"
          # A guest's own test report on the run page is unlabelled and repeated for every build it
          # runs (anki-android's build writes one per test task); the merge job writes the page.
          unset GITHUB_STEP_SUMMARY
          # A runner that runs out of memory or disk is shut down whole, and this step's log is all
          # it leaves: the machine's use, every 30 seconds, beside the build's.
          bench/machine_sampler.sh & sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          tar -xzf "$RUNNER_TEMP/record/$NAME/state.tar.gz" -C bench
          mapfile -t args < <(jq -r '.[] | select(. != "--recapture")' <<< "$ARGS")
          python3 bench/run.py "${args[@]}" --accepted "bench/logs/$NAME/accepted.json" \
            --shard "$SHARD"
      # The merge reads it; kept as long as the records it was cut from. Before the second pass,
      # which nothing of it waits for.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ fromJSON(inputs.project).project }}-${{ matrix.shard }}-of-${{ needs.record.outputs.of }}
          retention-days: 3
          path: |
            bench/logs/${{ fromJSON(inputs.project).project }}/shard-${{ matrix.shard }}-of-${{ needs.record.outputs.of }}.json
            bench/logs/evidence/
            bench/logs/${{ fromJSON(inputs.project).project }}/**/*.stall-*.log
            bench/logs/${{ fromJSON(inputs.project).project }}/**/*.network-*.log
      # The same rows against the isolated map, their ground truth taken from the rows above. The
      # task has one map directory, so the shared map makes way for the isolated one: nothing after
      # this step reads it. A fault or a timeout here leaves the shared rows as they are, uploaded
      # above, and the step stops before the job's own limit.
      - name: measure this slice against the isolated map
        id: second
        if: needs.record.outputs.isolated == 'true' && steps.isolated.outcome == 'success'
        continue-on-error: true
        env:
          NAME: ${{ fromJSON(inputs.project).project }}
          ARGS: ${{ toJSON(fromJSON(inputs.project).args) }}
          GITHUB_TOKEN: ${{ fromJSON(inputs.project).project == 'bitwarden-android' && github.token || '' }}
          CHECKOUT: ${{ fromJSON(inputs.project).checkout }}
          SHARD: ${{ matrix.shard }}/${{ needs.record.outputs.of }}
          SLICE: shard-${{ matrix.shard }}-of-${{ needs.record.outputs.of }}.json
        run: |
          set -eu
          unset GITHUB_STEP_SUMMARY
          left=$(( $(cat "$RUNNER_TEMP/slice-start") + 340 * 60 - $(date +%s) ))
          if [ "$left" -lt 300 ]; then
            echo "::warning::$NAME $SHARD: no time left in the job for the isolated arm"
            exit 0
          fi
          bench/machine_sampler.sh & sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          rm -rf "bench/$CHECKOUT/.gradle/yoriwake"
          tar -xzf "$RUNNER_TEMP/isolated/$NAME/state.tar.gz" -C bench
          mapfile -t shapes < <(jq -r 'index("--shapes") as $at | if $at then .[$at], .[$at + 1] else empty end' <<< "$ARGS")
          timeout --kill-after=60 "$left" python3 bench/run.py "$(jq -r '.[0]' <<< "$ARGS")" \
            "${shapes[@]+"${shapes[@]}"}" --isolated-capture --pair-with "bench/logs/$NAME/$SLICE" \
            --accepted "bench/logs/$NAME/accepted.json" --shard "$SHARD"
          # Only a pass that ended: one cut short leaves rows the merge would count as the slice's.
          mkdir -p "$RUNNER_TEMP/isolated-slice/evidence"
          cp "bench/logs/$NAME.isolated/$SLICE" "$RUNNER_TEMP/isolated-slice/"
          cp "bench/logs/evidence/$NAME-isolated.tar.gz" "$RUNNER_TEMP/isolated-slice/evidence/" \
            2>/dev/null || true
      # Its own artifact, which the merge reads where it is there.
      - if: ${{ !cancelled() && steps.second.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-shard-${{ fromJSON(inputs.project).project }}-${{ matrix.shard }}-of-${{ needs.record.outputs.of }}
          retention-days: 3
          path: ${{ runner.temp }}/isolated-slice/
      # The same rows against the budget map, last, as the isolated pass above: the map directory
      # makes way for it, and a fault or a timeout costs this arm alone.
      - name: measure this slice against the budget map
        id: third
        if: needs.record.outputs.budget == 'true' && steps.budget.outcome == 'success'
        continue-on-error: true
        env:
          NAME: ${{ fromJSON(inputs.project).project }}
          ARGS: ${{ toJSON(fromJSON(inputs.project).args) }}
          GITHUB_TOKEN: ${{ fromJSON(inputs.project).project == 'bitwarden-android' && github.token || '' }}
          CHECKOUT: ${{ fromJSON(inputs.project).checkout }}
          SHARD: ${{ matrix.shard }}/${{ needs.record.outputs.of }}
          SLICE: shard-${{ matrix.shard }}-of-${{ needs.record.outputs.of }}.json
        run: |
          set -eu
          unset GITHUB_STEP_SUMMARY
          left=$(( $(cat "$RUNNER_TEMP/slice-start") + 340 * 60 - $(date +%s) ))
          if [ "$left" -lt 300 ]; then
            echo "::warning::$NAME $SHARD: no time left in the job for the budget arm"
            exit 0
          fi
          bench/machine_sampler.sh & sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          rm -rf "bench/$CHECKOUT/.gradle/yoriwake"
          tar -xzf "$RUNNER_TEMP/budget/$NAME/state.tar.gz" -C bench
          mapfile -t shapes < <(jq -r 'index("--shapes") as $at | if $at then .[$at], .[$at + 1] else empty end' <<< "$ARGS")
          timeout --kill-after=60 "$left" python3 bench/run.py "$(jq -r '.[0]' <<< "$ARGS")" \
            "${shapes[@]+"${shapes[@]}"}" --isolated-budget 2x --pair-with "bench/logs/$NAME/$SLICE" \
            --accepted "bench/logs/$NAME/accepted.json" --shard "$SHARD"
          mkdir -p "$RUNNER_TEMP/budget-slice/evidence"
          cp "bench/logs/$NAME.budget/$SLICE" "$RUNNER_TEMP/budget-slice/"
          cp "bench/logs/evidence/$NAME-budget.tar.gz" "$RUNNER_TEMP/budget-slice/evidence/" \
            2>/dev/null || true
      # Its own artifact, which the merge reads where it is there.
      - if: ${{ !cancelled() && steps.third.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budget-shard-${{ fromJSON(inputs.project).project }}-${{ matrix.shard }}-of-${{ needs.record.outputs.of }}
          retention-days: 3
          path: ${{ runner.temp }}/budget-slice/
      - name: say what this job downloaded
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 bench/deps_pack.py report "$RUNNER_TEMP/deps-before.json"

  # What the selector would do on the project's last real commits, each reverted on the recorded
  # tree and asked without running a test (bench/commit_replay.py). A job of its own, beside the
  # slices: a fault, its timeout or a lost runner here costs the project its line of that figure,
  # never its rows. The merge reads its file where there is one and names the project where not.
  replay:
    needs: record
    if: inputs.commits != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      # The stamp of the plugin restored below, checked instead of publishing it again.
      YORIWAKE_PUBLISHED: ~/.m2/repository/io/github/zeuspizza/published.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            ${{ needs.record.outputs.jdk11 }}
            ${{ needs.record.outputs.jdk17 }}
            ${{ needs.record.outputs.jdk25 }}
            ${{ needs.record.outputs.jdk26 }}
            ${{ needs.record.outputs.jdk21 }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          add-job-summary: never
      # The plugin under test, published once for the run by sweep.yml's publish job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-under-test
          path: ~/.m2/repository/io/github/zeuspizza
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: record-${{ fromJSON(inputs.project).project }}
          # Outside the checkout: an untracked file in it makes run.py refuse the tree as dirty.
          path: ${{ runner.temp }}/record
      # The record job's dependency pack, over setup-gradle's restore; without it, the guest
      # resolves as it always did.
      - if: needs.record.outputs.deps != ''
        continue-on-error: true
        timeout-minutes: 15
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.record.outputs.deps }}
          path: ${{ runner.temp }}/deps-in
      - name: restore the dependency pack
        continue-on-error: true
        timeout-minutes: 15
        run: python3 bench/deps_pack.py restore "$RUNNER_TEMP/deps-in" "$RUNNER_TEMP/deps-before.json"
      # Its own bound inside the job's, so its own faults end here and the upload below still runs.
      - name: replay the last real commits
        continue-on-error: true
        timeout-minutes: 80
        env:
          NAME: ${{ fromJSON(inputs.project).project }}
          ARGS: ${{ toJSON(fromJSON(inputs.project).args) }}
          GITHUB_TOKEN: ${{ fromJSON(inputs.project).project == 'bitwarden-android' && github.token || '' }}
          CHECKOUT: ${{ fromJSON(inputs.project).checkout }}
          COMMITS: ${{ inputs.commits }}
        run: |
          set -eu
          unset GITHUB_STEP_SUMMARY
          # A runner that runs out of memory or disk is shut down whole, and this step's log is all
          # it leaves: the machine's use, every 30 seconds, beside the builds'.
          bench/machine_sampler.sh & sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          tar -xzf "$RUNNER_TEMP/record/$NAME/state.tar.gz" -C bench
          # This runner did not record the map, so it checks the restored plugin under test itself.
          python3 bench/commit_replay.py "$(jq -r '.[0]' <<< "$ARGS")" --checkout "bench/$CHECKOUT" \
            --commits "${COMMITS:-8}" --publish --out "$RUNNER_TEMP/replay/$NAME/commit-replay.json"
      # Under the project's name, as the record is. Not named record-*.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-${{ fromJSON(inputs.project).project }}
          retention-days: 3
          path: ${{ runner.temp }}/replay/
          if-no-files-found: ignore
      - name: say what this job downloaded
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 bench/deps_pack.py report "$RUNNER_TEMP/deps-before.json"
