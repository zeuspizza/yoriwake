name: scan

# The backstop for the scan every push runs first (CONTRIBUTING.md): what a pull request adds, its
# commit messages, and its title and body, from which the squash commit on main is written. Its own
# workflow, so editing a description re-scans it without re-running the build. A pull request from a
# fork may name, in its messages, the AI tool that assisted it, as CONTRIBUTING.md asks; one from a
# branch here may not. A deleted head repository counts as a fork.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  scan:
    name: no private references
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -eu
          fork=
          if [ "$FORK" = true ]; then fork=--fork; fi
          status=0
          # $fork unquoted: empty, it adds no argument.
          python3 bench/scan_private.py $fork --range "$BASE" "$HEAD" || status=1
          python3 bench/scan_private.py $fork --message PR_TITLE PR_BODY || status=1
          exit "$status"
