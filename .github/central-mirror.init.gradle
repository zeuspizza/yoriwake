// CI only: `.github/ci.py central-mirror` installs this into a job's Gradle user home. Every
// repository a build points at Maven Central asks Google's mirror of Central instead, and Central
// itself, added right after it, serves what the mirror does not have. Central rate-limits a runner
// pool's shared address (429), and one such answer failed whole jobs; the mirror states no limit.
// Groovy, not Kotlin: it runs in every Gradle a job starts, guests' old ones included.

class CentralMirror {
    // ci.py's CENTRAL_MIRROR: the two must name the same URL.
    static final String MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'
    static final String CENTRAL = 'https://repo.maven.apache.org/maven2/'
    static final String FALLBACK = 'yoriwakeCentralFallback'

    static boolean central(URI uri) {
        uri != null && uri.host in ['repo.maven.apache.org', 'repo1.maven.org'] &&
            (uri.path ?: '').replaceAll('/+$', '') == '/maven2'
    }

    static void mirrorFirst(RepositoryHandler repositories) {
        repositories.withType(MavenArtifactRepository).whenObjectAdded { MavenArtifactRepository repository ->
            if (repository.name.startsWith(FALLBACK) || !central(repository.url)) {
                return
            }
            repository.url = MIRROR
            if (repositories.findByName(FALLBACK) == null) {
                repositories.maven { MavenArtifactRepository fallback ->
                    fallback.name = FALLBACK
                    fallback.url = CENTRAL
                }
            }
        }
    }
}

gradle.beforeSettings { settings ->
    CentralMirror.mirrorFirst(settings.buildscript.repositories)
    CentralMirror.mirrorFirst(settings.pluginManagement.repositories)
    // Gradle 6.8 and later.
    if (settings.hasProperty('dependencyResolutionManagement')) {
        CentralMirror.mirrorFirst(settings.dependencyResolutionManagement.repositories)
    }
}

// Gradle 8.8's callback keeps a build under Isolated Projects valid; `beforeProject` is older.
def eachProject = { Project project ->
    CentralMirror.mirrorFirst(project.buildscript.repositories)
    CentralMirror.mirrorFirst(project.repositories)
}
if (GradleVersion.current().baseVersion >= GradleVersion.version('8.8')) {
    gradle.lifecycle.beforeProject(eachProject)
} else {
    gradle.beforeProject(eachProject)
}
