# The qualification verdict for this project lives in `bench/qualification.txt`,
# which the harness writes from a real run. It is deliberately NOT repeated here: it was,
# and once seven of these files still claimed NOT QUALIFIED for projects the
# table had passed, with nothing comparing the two.
# HOW TO ADD ONE: bench/README.md, "Adding a project".
# Qualify before sweeping -- that stage is where every defect this corpus has found
# actually turned up, none of them from a sweep:
#     python bench/qualify.py bench/projects/armeria.toml
#
# WHY THIS ONE: Good test hygiene at large scale.
#
# KNOWN RISK: Risk is socket binding. Worth knowing either way: if it is not hermetic,
# that is a documented boundary of what this tool can be benchmarked against.
#
# The module below is a FIRST GUESS. If it hangs, wants a container, or is off the JUnit Platform,
# move to a sibling rather than writing the project off: four projects were written off here and all
# four ran once someone read the actual error.
name = "armeria"

# HOW DEEP A SWEEP OF THIS PROJECT GOES, and why this number.
# derived from this project's own observed rate of rows where a miss was possible per
# target: four such rows divided by that ratio.
# `sweep_corpus.py` uses it in place of its own --limit; the value that wrote each row is
# stamped on that row, so a resumed sweep at a different depth cannot make this a lie.
sweep_limit = 13
url = "https://github.com/line/armeria.git"

# Pinned to a full 40-character SHA. The harness clones ONCE and never re-clones, so a commit
# newer than an existing checkout is simply absent -- which is what blocked micrometer and
# junit5 with "fatal: reference is not a tree". checkout_project now fetches the commit and
# retries before failing.
#
# NOT because the clone is shallow: it is not, `git clone` here passes no --depth. That claim
# was written into eleven of these files and into a commit message before anyone checked it.
commit = "f3c55ee0d346c1430ee08b806fe16ac4af3af854"
module = "grpc"
flags = ["-PnoLint"]
sources = ["grpc/src/main/java/com/linecorp/armeria"]

# `sources` WAS EMPTY, and an empty one is not "mutate everything" -- the mutation grammar
# found zero targets, applied nothing, and the sweep reported 0 missed of 0 induced failures.
# The harness refuses to read that as a safety result ("NO ROW ASKED A RECALL QUESTION"), which
# is the only reason it was visible at all. Scoped to the module under measurement, because a
# mutation outside it cannot break a test the measured task runs.


# Set BEFORE the first OOM rather than after it. rxjava's capture died decoding 14,221 tests on the
# default daemon heap and left a map with no scope file, which then forced every later run.
daemon_jvmargs = "-Xmx4g"

# BLOCKED, and now with a name rather than an anonymous exit 1.
#
#     -XDaddTypeAnnotationsToSymbol=true is required by Error Prone on JDK 21
#
# Error Prone runs in armeria's compile and wants a javac flag this build does not pass on JDK 21.
# That is a toolchain question, not a selection one, and it is untried: a `daemon_java_version` of
# 17 -- find_jdk resolves one on this machine -- is the obvious next thing and nobody has run it.
# Recorded so the next attempt starts from here instead of from "the build failed".
#
# UNBLOCKED, and by armeria's own build rather than by anything clever.
#
# 17 was the obvious next thing and it is wrong: a dependency requires a JVM runtime of at least 21,
# so the daemon on 17 fails earlier than Error Prone ever runs. The squeeze looks unresolvable from
# the error alone -- 17 is too old, 21 is what Error Prone refuses on.
#
# Reading armeria's own CI settles it. `.github/workflows/actions_build.yml` builds on JDK 25 and
# passes `-PnoLint` to EVERY Gradle invocation, and `build.gradle:191` applies the Error Prone
# plugin only `if (!rootProject.hasProperty('noLint'))`. The compiler plugin that blocked this is
# one armeria itself never runs in CI, and `-PnoLint` is its own property, not a flag invented here.
# Nothing about the tests changes: Error Prone is a lint pass over the compile.
daemon_java_version = 25

# AND THE MODULE MOVED, from `core` to `grpc`, for a reason worth reading before moving it back.
#
# With the compile unblocked, `:core:test` started 728 test classes and was then KILLED BY OUR OWN
# STALL GUARD at 20 minutes of silence -- while it was demonstrably still working: the test worker
# held 11% of a core and `core/build/test-results/test/binary/` was written a minute before the
# kill. Gradle prints nothing during a long test task under `--console=plain`, so `process.run`,
# which watches the LOG for growth, cannot tell that suite from spring-core parked on a latch. The
# guard's docstring assumes "the quietest legitimate phase is a single test class that runs for
# minutes", and 728 of them in one task is not that.
#
# So `core` is not blocked by armeria and not really qualified either -- it is unmeasured, and at
# 730 test files it is a poor sweep target anyway, since every sweep run pays that wall clock.
# `grpc` is the next largest at 108 test files: big enough to be worth selecting on, small enough
# to finish. The stall guard's blind spot is a separate finding and outlives this project file.
#
# THE STALL GUARD IS FIXED: it now also watches what the build writes, so a silent
# test task is no longer indistinguishable from a hung one. `core` is therefore MEASURABLE again,
# and the module stays `grpc` for the other reason only -- 730 test files is a poor sweep target
# when every run pays that wall clock. Moving it back is a cost decision now, not a blocked one.
