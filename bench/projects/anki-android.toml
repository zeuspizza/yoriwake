# The big Android target: a real app, not a fixture.
#
# WHY THIS ONE, and it took a screen to find. Android projects are overwhelmingly JUnit 4, which
# this tool structurally CANNOT deselect -- the agent is a JUnit Platform PostDiscoveryFilter, so a
# suite running off the Platform is never even offered to it. That is the documented mockito case.
# Screening the largest Android repositories for `useJUnitPlatform` and `junit-jupiter` found ZERO
# in glide (35k stars), Signal-Android (29k), nowinandroid (22k) and tivi (6.7k).
#
# AnkiDroid is the exception, and for the reason that matters most: it wires
# `junit-vintage-engine`. Vintage runs JUnit 4 tests ON the Platform, so they become discoverable
# and therefore selectable. That is the general escape from Android's JUnit 4 problem, and it is
# worth knowing that a real project already does it.
name = "anki-android"

# HOW DEEP A SWEEP OF THIS PROJECT GOES, and why this number.
# no prior ratio, so the default of 16. Re-price after the first pass.
# `sweep_corpus.py` uses it in place of its own --limit; the value that wrote each row is
# stamped on that row, so a resumed sweep at a different depth cannot make this a lie.
sweep_limit = 16
url = "https://github.com/ankidroid/Anki-Android.git"
commit = "887495541f910355d0e4109b8410c9c1d3d21f19"
module = "AnkiDroid"

# Product flavours: `play` is the default, so the unit-test task is per flavour AND per build type.
# Nothing here is called `test`.
test_task = "testPlayDebugUnitTest"
# The compile gate's task. Derived from `test_task` it names `<test_task>Classes`, which an
# Android unit-test variant does not have; the Java compile task's graph carries the Kotlin,
# kapt and ksp phases a mutation can fail in. Read from this project's own build logs, as
# duckduckgo-android's is.
test_classes_task = "compilePlayDebugUnitTestJavaWithJavac"

# Bounds every Kotlin compile daemon the build starts; see the memory note below.
flags = ["-Pkotlin.daemon.jvmargs=-Xmx2g"]
sources = ["AnkiDroid/src/main/java"]

# MEMORY, for the 16 GB CI runner, which was shut down mid-recording in every full run on it,
# with nothing in any log. The target is a peak Java RSS of 12,800 MB: 16 GB, less ~1.5
# GB the runner holds idle, less 2 GB to spare. Measured on a 64 GB Mac (macOS resident sizes, so a
# lower bound), one isolated recording at --isolated-forks 4, sampled every 5 s:
#
#   -Xmx6g, the guest's 4 forks:              peak 20,680 MB (test workers 13,120, Kotlin 5,020,
#               Gradle 2,475); capture 195.6s, baseline 226.3s
#   -Xmx6g, 1 fork:                           peak 16,296 MB (Kotlin 10,214 over 3 daemons,
#               Gradle 2,963, test worker 3,001); capture 361.9s, baseline 433.2s
#   as set here, 2 forks:                     peak 12,767 MB (Kotlin 5,777 over 3 daemons at
#               -Xmx2g, Gradle 2,649 at -Xmx3g, test workers 4,224); capture 241.7s, baseline 286.3s
#
# The build starts three Kotlin compile daemons, one per compiler classpath, and each inherits the
# Gradle daemon's heap unless `kotlin.daemon.jvmargs` (in `flags`) bounds it. 3g is the project's
# own `org.gradle.jvmargs`. 2 forks fit with 33 MB to spare; 1 fork is the fallback if a runner's
# samples show less room.
daemon_jvmargs = "-Xmx3g"
max_parallel_forks = 2

# REQUIRES: an Android SDK via ANDROID_HOME, compileSdk 36 (AGP downloads it when the licences are
# accepted, which they are on this machine), and the Robolectric android-all jars, which are fetched
# on first run and are large.
#
# Gradle 9.7.1 and AGP 9.0.1. Checked BEFORE cloning anything big, on samples/demo with the wrapper
# repointed at 9.7.1: the plugin captures 24 records and narrows 11 tests to 3, so Gradle 9 is not
# the risk here. That question cost two minutes and would have invalidated the whole target.

# BLOCKED, and the refusal is CORRECT. AnkiDroid enables JUnit Jupiter's in-JVM parallel
# execution, and the plugin declines rather than blend per-test coverage attribution:
#
#     In-JVM parallel test execution is enabled on :AnkiDroid:testPlayDebugUnitTest
#     (via junit.jupiter.execution.parallel.enabled) -- tests interleaved inside one JVM share a
#     single coverage agent, so per-test attribution would silently blend them.
#
# That is a real, general limitation worth publishing: A PROJECT USING JUNIT 5 PARALLEL EXECUTION
# CANNOT USE THIS TOOL as configured. Measuring it anyway would mean turning that off, which changes
# the thing being measured more than the vintage init script does -- their suite is designed around
# it -- so it is left blocked and documented rather than quietly reconfigured.
#
# The first qualification ALSO exposed a defect in the screen itself: it reported "the plugin never
# attached" about the very plugin that had just refused, because no map directory existed. A failed
# build and an absent plugin are now distinguished, and pinned by a test.
