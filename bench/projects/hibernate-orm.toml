# The qualification verdict for this project lives in `bench/qualification.txt`,
# which the harness writes from a real run. It is deliberately NOT repeated here: it was,
# and once seven of these files still claimed NOT QUALIFIED for projects the
# table had passed, with nothing comparing the two.
# HOW TO ADD ONE: bench/README.md, "Adding a project".
# Qualify before sweeping -- that stage is where every defect this corpus has found
# actually turned up, none of them from a sweep:
#     python bench/qualify.py bench/projects/hibernate-orm.toml
#
# ADDED from a screen of candidate projects. Nothing here has been cloned, built, or attached to by
# this plugin; the verdict is whatever `qualify.py` writes into the table, and this file
# deliberately does not guess at it -- twelve files once cached a verdict here and seven of
# them contradicted the table. Four projects were also once written off on the strength of a
# table and all four ran once someone read the actual error. This file is the question.
#
# WHY THIS ONE: The largest hermetic single-module suite the screen found -- roughly 9,000 test files in one
#   module, against H2 in memory. The direct test of the claim that a fixed configuration cost
#   amortises, at the opposite end from okhttp.
#
# KNOWN RISK: Some tests run against a database profile. Confirm H2 is the default before believing a
#   hermetic verdict, and expect this suite to be the most expensive row in the corpus.
#
# The module below is a FIRST GUESS. If it hangs, wants a container, or is off the JUnit
# Platform, move to a sibling rather than writing the project off.
name = "hibernate-orm"

# HOW DEEP A SWEEP OF THIS PROJECT GOES, and why this number.
# no prior ratio, so the default of 16. Re-price after the first pass.
# `sweep_corpus.py` uses it in place of its own --limit; the value that wrote each row is
# stamped on that row, so a resumed sweep at a different depth cannot make this a lie.
sweep_limit = 16
url = "https://github.com/hibernate/hibernate-orm.git"

# Pinned to a full 40-character SHA, which `qualify.py` checks before it clones. Taken from
# the repository's default branch.
commit = "21a2655a97b344e3aec0e4b1ed55bfda3bd1bbaf"
module = "hibernate-core"
flags = []
# CORRECTED. `settings.gradle` applies `org.hibernate.orm.build.jdks-settings`
# and resolves a JDK range BEFORE any toolchain is consulted, so the DAEMON's own version decides
# whether the build configures at all. Two JDK 25 installs are already under `~/.gradle/jdks`, which
# is exactly the root `run.py`'s `find_jdk` searches.
daemon_java_version = 25
# AND ITS OUTPUT IS NOT IN `build/`. hibernate-orm sets its layout
# to `target/`, so the first qualification after the JDK fix reported "the build exited 0 but ran NO
# TESTS -- a green build that ran nothing" for a run that executed 24,798 tests, captured a
# 34,561-record map, and left 4,755 result XML files in `hibernate-core/target/test-results/test`.
#
# Same defect `module_dir` exists for, pointing the other way: that one is a real directory under a
# wrong NAME, this is the right name under a wrong ROOT. Both end in the harness reading an empty
# directory and filing a real run as nothing.
build_dir = "target"
# The mutation roots AND the `git log` pathspec. Never empty: an empty pathspec matches
# every commit, which is the opposite of what this key is for, and the replay refuses it.
sources = ["hibernate-core/src/main/java"]

# Set BEFORE the first OOM rather than after it. rxjava's capture died decoding 14,221
# tests on the default daemon heap and left a map with no scope file, which then forced
# every later run.
# RAISED FROM 4g, and the 4g was already the "set it before the first OOM" version.
# The capture ran and merging its records into the map died with `java.lang.OutOfMemoryError: Java
# heap space` anyway, so the map kept its previous contents, the warm-up never reached the tests,
# and the sweep aborted rather than time two incomparable arms -- this project produced no results
# file at all in a two-day corpus re-sweep. 8g is a guess proportioned to a build far larger than
# rxjava's 14,221 tests, which is what 4g was chosen for; if it OOMs again the number is not the
# answer and the decode is.
daemon_jvmargs = "-Xmx8g"

# THE 8g RAISE WAS NEVER TESTED AND STILL HAS NOT BEEN, because the build no longer compiles at its
# own pin. The check was a measurement, not a fix: run the sweep and find
# out whether the decode survives 8g or dies as it did at 4g. The build never reached a test task.
#
#     > Task :hibernate-testing:compileJava FAILED
#     PersistenceUnitInfoAdapter is not abstract and does not override abstract method
#       getAllModuleDescriptors() in PersistenceUnitInfo
#     4 errors
#
# AND THE CAUSE IS THAT THIS PROJECT'S PIN DOES NOT PIN ITS BUILD. `gradle/libs.versions.toml` line
# 29 declares `jpa = "4.0.0-SNAPSHOT"`, and a SNAPSHOT is mutable. Two jars in this machine's Gradle
# cache settle it:
#
#     jakarta.persistence-api-3.2.0.jar            cached at qualification   getAllModuleDescriptors: no
#     jakarta.persistence-api-4.0.0-SNAPSHOT.jar   cached 3 days later       getAllModuleDescriptors: YES
#
# The project qualified once -- the table still records `tests=18102` from that run -- and
# the snapshot was re-resolved three days later with a new abstract method on `PersistenceUnitInfo`
# that this commit's own test-support classes do not implement. Nothing in this repository changed;
# the dependency did.
#
# WHAT THIS MEANS BEYOND THIS PROJECT, and it is the reason this is written here rather than in a
# commit message alone: a 40-character SHA does not pin a build whose dependencies are snapshots.
# Every project file in this corpus pins a commit precisely so a row can be re-derived, and that
# guarantee is void for this one. A figure taken from hibernate-orm on any date is a figure about
# whatever the snapshot was that day.
#
# THE BLOCKER THEREFORE CHANGES from `decode-refused` to "does not compile at its pin", and the
# decode question is not merely unanswered but unanswerable here until the project is repointed to a
# commit that resolves released dependencies. The plan's stopping rule -- do not raise the heap a
# third time -- is untouched: the heap was never reached.
#
# NOT A STALE CHECKOUT AND NOT THIS MACHINE. The checkout is clean at 21a2655a97, and the failing
# classes are the guest's own `hibernate-testing` sources compiled against the guest's own declared
# dependency.
