# The qualification verdict for this project lives in `bench/qualification.txt`,
# which the harness writes from a real run. It is deliberately NOT repeated here: it was,
# and seven of these files once still claimed NOT QUALIFIED for projects the
# table had passed, with nothing comparing the two.
# HOW TO ADD ONE: qualify before sweeping -- that stage is where every defect this corpus has found
# actually turned up, none of them from a sweep:
#     python bench/qualify.py bench/projects/spring-security.toml
#
# ADDED from the candidate screen. Nothing here has been cloned, built, or attached to by
# this plugin; the verdict is whatever `qualify.py` writes into the table, and this file
# deliberately does not guess at it -- twelve files once cached a verdict here and seven of
# them contradicted the table. Four projects were also once written off on the strength of a
# table and all four ran once someone read the actual error. This file is the question.
#
# WHY THIS ONE: The best module-count-to-test-time ratio the screen found: ~2,000 test files in `config`
#   behind 18 build files, JUnit 5 throughout, and zero testcontainers anywhere in the build.
#
# KNOWN RISK: Spring's AOT tests have produced one phantom MISSED in this corpus before. If a recall row
#   here reports a miss, isolate it before believing it.
#
# The module below is a FIRST GUESS. If it hangs, wants a container, or is off the JUnit
# Platform, move to a sibling rather than writing the project off.
name = "spring-security"

# HOW DEEP A SWEEP OF THIS PROJECT GOES, and why this number.
# no prior ratio, so the default of 16. Re-price after the first pass.
# `sweep_corpus.py` uses it in place of its own --limit; the value that wrote each row is
# stamped on that row, so a resumed sweep at a different depth cannot make this a lie.
sweep_limit = 16
url = "https://github.com/spring-projects/spring-security.git"

# Pinned to a full 40-character SHA, which `qualify.py` checks before it clones. Taken from
# the repository's default branch.
commit = "dec6e6eb6d087a0e4a95f9e55425e57e2dcf564c"
module = "spring-security-config"
# `settings.gradle` auto-includes by BUILD-FILE name, not by directory: it walks for `**/*.gradle`,
# strips the extension, and uses that as the project name (lines 22-56). `config/` holds
# `spring-security-config.gradle`, so the Gradle project is `:spring-security-config` while the
# directory stays `config/`.
#
# CORRECTED. The blocker recorded here was a first guess at the module
# name, not a property of the build.
module_dir = "config"
# `rncToXsd` LEFT OUT. It regenerates the tracked `spring-security-*.xsd` under
# `config/src/main/resources` from their `.rnc` sources, in place, whenever it runs; rewritten during
# the capture, every one is recorded as unknown and every later run forces on them (the first CI
# sweep stopped the project as setup-forced at its preflight on that list). Without the task,
# `processResources` copies the committed schemas, which is what the commit ships.
# `javascript/node_modules/` and `javascript/package-lock.json` LISTED in `notReadByTests`.
# `npmInstall` (web packs the module's `spring-security.js`, which the config tests serve) rewrites
# both on every run, the tracked lock file with the same content; the second CI sweep stopped the
# project as setup-forced at its preflight on them. No test reads either, and no row edits anything
# under `javascript/`, so the listing changes no row's answer, only stops the forcing.
flags = ["-x", "rncToXsd", "-I", "{yoriwake}/bench/guest-tests.init.gradle",
         "-Dyoriwake.harness.notReadByTests=javascript/node_modules/*,javascript/package-lock.json"]
# The mutation roots AND the `git log` pathspec. Never empty: an empty pathspec matches
# every commit, which is the opposite of what this key is for, and the replay refuses it.
sources = ["config/src/main/java"]

# Set BEFORE the first OOM rather than after it. rxjava's capture died decoding 14,221
# tests on the default daemon heap and left a map with no scope file, which then forced
# every later run.
daemon_jvmargs = "-Xmx4g"
