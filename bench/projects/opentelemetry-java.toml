# The qualification verdict for this project lives in `bench/qualification.txt`,
# which the harness writes from a real run. It is deliberately NOT repeated here: it was,
# and seven of these files once still claimed NOT QUALIFIED for projects the
# table had passed, with nothing comparing the two.
# HOW TO ADD ONE: qualify before sweeping -- that stage is where every defect this corpus has found
# actually turned up, none of them from a sweep:
#     python bench/qualify.py bench/projects/opentelemetry-java.toml
#
# ADDED from the candidate screen. Nothing here has been cloned, built, or attached to by
# this plugin; the verdict is whatever `qualify.py` writes into the table, and this file
# deliberately does not guess at it -- twelve files once cached a verdict here and seven of
# them contradicted the table. Four projects were also once written off on the strength of a
# table and all four ran once someone read the actual error. This file is the question.
#
# WHY THIS ONE: Hermetic, current, JUnit 5, and a module structure ordinary enough that a surprise here is
#   about the plugin rather than about the project.
#
# KNOWN RISK: Moderate suite length. If `sdk:trace` is seconds rather than minutes, move to a longer
#   sibling -- a short suite is where the fixed cost dominates and the row says little.
#
# The module below is a FIRST GUESS. If it hangs, wants a container, or is off the JUnit
# Platform, move to a sibling rather than writing the project off.
name = "opentelemetry-java"

# HOW DEEP A SWEEP OF THIS PROJECT GOES, and why this number.
# derived from this project's own observed rate of rows where a miss was possible per
# target: four such rows divided by that ratio.
# `sweep_corpus.py` uses it in place of its own --limit; the value that wrote each row is
# stamped on that row, so a resumed sweep at a different depth cannot make this a lie.
sweep_limit = 11
url = "https://github.com/open-telemetry/opentelemetry-java.git"

# Pinned to a full 40-character SHA, which `qualify.py` checks before it clones. Taken from
# the repository's default branch.
commit = "77b1ac4141b85759e5eee73bd06cc7091036b8af"
module = "sdk:trace"
# NO BUILD SCAN. With `CI` set, as on GitHub's runners, `settings.gradle.kts` agrees to the terms of
# service, publishes a scan of every build and writes its URL to `build-scan.txt` in the checkout.
# Written during the capture, that file is recorded as unknown and every later run forces on it:
# the first CI sweep stopped the project as setup-forced at its preflight. A local sweep never set
# `CI`, so it never saw the file.
flags = ["--no-scan"]
# The mutation roots AND the `git log` pathspec. Never empty: an empty pathspec matches
# every commit, which is the opposite of what this key is for, and the replay refuses it.
sources = ["sdk/trace/src/main/java"]
