# THE JUNIT 4 ARM OF mockito, AND IT EXISTS BECAUSE THE FLAG IS INERT WITHOUT IT.
#
# `mockito.toml` passes `scripts/junit-vintage.init.gradle.kts`, which calls `useJUnitPlatform()` on
# every Test task. `narrowPlainRunners` acts only on a task that runs plain JUnit 4 off the
# Platform, so under mockito's own configuration it does nothing at all, and a sweep that passed it
# and came back clean would be reporting on a flag that never fired. Reading an inert flag as a
# clean result is the failure this file exists to avoid.
#
# So this arm is mockito WITHOUT the Vintage script: a genuine JUnit 4 suite, off the Platform,
# where selection leaves out whole classes. It is also the arm on which an earlier class-granular
# path, since removed, missed 14 tests.
#
# READ THE CONDITION BACK FROM THE RUN. A selecting run that acts prints
#   "[yoriwake] <task> runs plain JUnit 4, so selection leaves out whole classes, and only those
#    whose runner runs exactly the class's own methods."
# If that line is absent the arm was inert and no conclusion may be drawn from it.
#
# A FIXTURE, NOT A CORPUS MEMBER. It measures the same upstream code as `mockito` under a different
# runner, so counting both would put one project in the denominator twice. `corpus_state.py` reads
# this key and reports it in its own block, in no denominator.
name = "mockito-junit4"
fixture = true

url = "https://github.com/mockito/mockito.git"
commit = "5a676bcd9ef9a10db46e1dc34e190eb46faa2687"
module = "mockito-core"

# No Vintage script, which is the whole point of this file (`mockito.toml` carries
# `["-I", "{yoriwake}/scripts/junit-vintage.init.gradle.kts"]` here). `narrowPlainRunners` lets a
# selecting run leave out whole plain JUnit 4 classes; it is inert on a recording run.
flags = ["-Pyoriwake.narrowPlainRunners"]

sources = ["mockito-core/src/main/java/org/mockito/internal/stubbing"]

# The same depth `mockito.toml` uses, so the two arms are comparable row for row.
sweep_limit = 16
