# THE JUNIT 4 ARM OF mockito, AND IT EXISTS BECAUSE THE FLAG IS INERT WITHOUT IT.
#
# `mockito.toml` passes `scripts/junit-vintage.init.gradle.kts`, which calls `useJUnitPlatform()` on
# every Test task. `excludeDeselectedClasses` -- the repository's only class-granularity path --
# early-returns when `task.options is JUnitPlatformOptions`. So under mockito's own configuration
# `-Pyoriwake.internal.classSelection` does nothing at all, and a sweep that passed it and came back clean would
# be reporting on a flag that never fired. Reading an inert flag as a clean result is the failure
# this file exists to avoid.
#
# So this arm is mockito WITHOUT the Vintage script: a genuine JUnit 4 suite, off the Platform,
# where the class-granular path actually runs. It is the arm that produced the 14 missed tests,
# and the arm that has to be re-run before anything is fixed -- the nested-run
# attribution fix landed in `TestBoundaries.java` on the same day class selection was switched off,
# and nothing has re-measured it since. The stale premise survives only in a `YoriwakePlugin.kt` comment.
#
# READ THE CONDITION BACK FROM THE RUN. The acting path prints
#   "[yoriwake] <task> does not run on the JUnit Platform, so selection is applied at class granularity
#    through Gradle's filter: N test classes excluded."
# If that line is absent the arm was inert and no conclusion may be drawn from it.
#
# A FIXTURE, NOT A CORPUS MEMBER. It measures the same upstream code as `mockito` under a different
# runner, so counting both would put one project in the denominator twice. `corpus_state.py` reads
# this key and reports it in its own block, in no denominator.
name = "mockito-junit4"
fixture = true

url = "https://github.com/mockito/mockito.git"
commit = "5a676bcd9ef9a10db46e1dc34e190eb46faa2687"
module = "mockito-core"

# DELIBERATELY EMPTY, and that is the whole point of this file. `mockito.toml` carries
# `["-I", "{yoriwake}/scripts/junit-vintage.init.gradle.kts"]` here.
flags = []

sources = ["mockito-core/src/main/java/org/mockito/internal/stubbing"]

# The same depth `mockito.toml` uses, so the two arms are comparable row for row.
sweep_limit = 16
