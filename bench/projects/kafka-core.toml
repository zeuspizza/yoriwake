# The qualification verdict for this project lives in `bench/qualification.txt`,
# which the harness writes from a real run. It is deliberately NOT repeated here: it was,
# and once seven of these files still claimed NOT QUALIFIED for projects the
# table had passed, with nothing comparing the two.
# HOW TO ADD ONE: bench/README.md, "Adding a project".
#
# ADDED from a screen of candidate projects. Nothing here has been captured or audited yet; the
# verdict is whatever `qualify.py` writes into the table, and this file deliberately does not
# guess at it.
#
# WHY THIS ONE: THE SCALA REPRESENTATIVE, and on the screen's evidence essentially the only one
#   available. Kafka's `core` is Scala 2.13 and still Gradle-built in 2026 -- 53 Scala files under
#   `core/src/main` against 16 Java ones. The alternatives are thin: Iceberg's Scala is main-only
#   with no Scala tests, Armeria's is examples plus one integration module, and OpenTelemetry's is
#   scattered across instrumentation modules. `InstrumentationScope` has read `.scala` since the
#   extension was added and nobody has ever watched a Scala module derive a scope, attach, and
#   narrow on a real build -- that observation is the whole point of this row.
#
# AND IT COSTS NO CLONE. `kafka` is already in the corpus at the same commit, measured on its
#   `clients` module. This file borrows that checkout rather than cloning 11 GB again; borrowed
#   checkouts qualify last, which `_corpus_order` already arranges and `detekt-junk` precedes.
#
# KNOWN RISK: Kafka's integration tests are famously port-bound, and `core` is not `clients` --
#   the existing kafka row's hermetic verdict does not transfer, and must be re-established here.
#   Expect this to be the more expensive of the two rows if it qualifies at all.
#
# A RECALL ROW IS POSSIBLE HERE, unlike grails-core: `core/src/main/java` sits beside the Scala
#   tree, so `target_ordering.mutation_targets` has something to glob. What it will NOT do is
#   mutate the Scala, so a recall figure from this row says nothing about Scala sources -- see the
#   glob in `bench/target_ordering.py`. Both roots are named below so the `git log` pathspec
#   covers real Scala commits even though only the Java half yields mutation targets.
name = "kafka-core"

# HOW DEEP A SWEEP OF THIS PROJECT GOES, and why this number (re-priced after the
# first pass, which is what the default of 16 was placed to wait for).
# four rows where a miss is possible, divided by this project's own observed rate of such rows
# per target. That rate is 1.0 -- and it is ONE OBSERVATION, the single row the first pass
# bought at 1,795s. A ratio from n=1 is thin, and a second pass may move this number again;
# what it is not is a guess, which is what 16 was.
# The honest alternative was 16 at roughly 9.3 hours, against 4 at roughly 2 hours, for a
# project whose full arm is the most expensive in the corpus.
# `sweep_corpus.py` uses it in place of its own --limit; the value that wrote each row is
# stamped on that row, so a resumed sweep at a different depth cannot make this a lie.
sweep_limit = 4
url = "https://github.com/apache/kafka.git"

# The same 40-character pin as `kafka.toml`, because it is the same checkout. If the two ever
# disagree, the borrow below silently measures a commit this file does not name.
commit = "54a57d7c70ee7f1811da282fc2adc594f3b55372"

# Borrowed, not cloned. `checkout_project` reads this and leaves the directory alone; it is
# deliberately unpinned by this file, which is why the commit above must match kafka.toml's.
path = "bench/checkouts/kafka"

module = "core"
# THE GUEST'S STATIC ANALYSIS IS EXCLUDED, AND THAT IS A CAVEAT ON EVERY ROW FROM HERE.
#
# Measured. kafka runs Checkstyle and SpotBugs over MAIN sources in the test task's
# dependency chain, and both reject the harness's mutations:
#
#   :clients:checkstyleMain  '{' at column 19 should have line break after. [LeftCurly]
#   :core:spotbugsMain       a constant mutated to collide with its sibling version constants
#
# `assert_recall.py` exits 1 on any build-failed row, so these cost kafka `clients` 8 of 21 rows and
# kafka `core` its only row. The first was fixed in the generator (the injection is now a formatted
# block); the second cannot be -- a mutation is semantically odd by construction, which is what a
# semantic analyser is built to notice.
#
# This harness measures test SELECTION. A guest's own style and bug-pattern gates running ahead of
# its tests are not part of that question, so they are excluded here -- the same class of caveat as
# junit5's `-Dorg.gradle.isolated-projects=false` and gradle's `--dependency-verification=off`. Any
# row from this project describes a build configured the way this harness needs, not the way kafka
# ships.
flags = ["-x", "checkstyleMain", "-x", "spotbugsMain"]
# BOTH roots. The Scala half is what the pathspec is for -- a `git log` over Scala-only commits is
# the history this row exists to replay -- and the Java half is what the mutation grammar can
# actually target. Naming only the Scala root would produce an empty target list and a results file
# with zero rows, which reads as `0 missed of 0`.
sources = ["core/src/main/scala", "core/src/main/java"]

# Set BEFORE the first OOM rather than after it, and kafka's `clients` row already needs it.
# DROPPED FROM THE RECALL DENOMINATOR, because this guest's own suite cannot hold a
# result. Measured, not assumed: three full runs of `:core:test` with NOTHING mutated anywhere in
# the tree gave 7, 9 and 7 failures across THREE DIFFERENT failing sets, from ten distinct tests.
# Eight runs of `kafka.network.SocketServerTest` alone gave six different failing sets.
#
# WHAT THAT DID TO THE FIGURE. One sweep reported this project as the corpus's only
# misses -- 8 on the first pass, 5 on a re-measurement of the identical four targets. Four of the
# five fail with no mutation present (one in 3 of 3 runs). The fifth was reported missed on one
# sweep and did not even fail on the other, against the same mutation; a real miss reproduces.
#
# THE MECHANISM IS THE BASELINE SAMPLE, not the selector. The harness subtracts an already-failing
# set drawn from `DEFAULT_BASELINE_REPEATS` unmutated runs, and two draws from a suite with ten
# intermittent tests barely overlap -- so a flake that the baseline missed arrives in the full arm
# looking exactly like an induced failure that selection failed to catch.
#
# THE ALTERNATIVE WAS PRICED AND DECLINED. Raising `repeats` would let the harness learn the flaky
# set itself, and each extra repeat is about two hours on this 7,399-second suite, every sweep,
# forever. Excluding the project costs one guest once.
#
# NOT A CLAIM ABOUT THE SELECTOR, and not a claim that kafka's tests are bad -- they are timing- and
# port-sensitive integration tests on a loaded laptop. Rows are still swept and still recorded; they
# are simply not evidence about recall. Delete this key and the project returns to the denominator.
unstable_suite = """three full unmutated runs gave 7, 9 and 7 failures across three different \
failing sets from ten distinct tests, so a failure in its rows cannot be attributed to selection"""

daemon_jvmargs = "-Xmx4g"
