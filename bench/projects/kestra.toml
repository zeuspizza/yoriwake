# MEMORY: build.gradle's `testHeapSizes` gives :core's test worker 2560m (it was a flat 4048m at the
# previous pin). On a 16 GB machine with ~7 GB free the worker plus the daemon plus the toolchain may
# still not fit, and a timed run then dies with "Gradle build daemon disappeared unexpectedly" at
# :core:test -- the moment the worker forks. Not an OOM: there is no OutOfMemoryError in the logs,
# and grepping for one matches Gradle's own -XX:+HeapDumpOnOutOfMemoryError debug line and yields a
# confident wrong answer.

# WINDOWS: core/build cannot be deleted by ordinary means, and Gradle cannot clean it either.
# Micronaut's generated bean-definition paths reach 300 characters, past the 260-char MAX_PATH, so
# `rm -rf` and PowerShell's Remove-Item both fail and a rebuild dies with "Failed to clean up stale
# outputs" on :core:processTestResources -- which reads like a corrupt checkout and is not. Clear it
# with robocopy mirroring an empty directory, after killing every JVM: one of the remaining files is
# a processTestResources output that any live java.exe holds open.

# Java, Micronaut, and a suite with 28 pre-existing failures. Chosen for what it does not share with
# detekt: the always-run rule dominates on a red suite, and a DI-heavy test JVM pays a large fixed
# startup cost that selection cannot remove.
name = "kestra"

# HOW DEEP A SWEEP OF THIS PROJECT GOES, and why this number.
# derived from this project's own observed rate of rows where a miss was possible per
# target: four such rows divided by that ratio.
# `sweep_corpus.py` uses it in place of its own --limit; the value that wrote each row is
# stamped on that row, so a resumed sweep at a different depth cannot make this a lie.
sweep_limit = 9
url = "https://github.com/kestra-io/kestra.git"
# Full 40 characters: an abbreviation in a pin is ambiguous by construction. Upstream develop on
# Gradle 9.8.1 and a Java 25 toolchain. The previous pin, c11fe3466f66cd1fe1eb76f3a0034095411156a9,
# was on Gradle 8.7, below the plugin's 8.14 floor: the plugin declined it, its record job captured
# no map, and its sweep shards had nothing to measure against.
commit = "bad4d5b551cd14242564ddac5db9791553871c41"
module = "core"
# `core/src/main/resources/gradle.properties` LISTED in `notReadByTests`. The build's
# `copyGradleProperties` task copies the root `gradle.properties` there, git-ignored, on every
# build, and a sweep stopped the project as setup-forced at its preflight on it. Tests read it only
# as a processed resource, which the map compares on the classpath, and no row edits it.
flags = ["-Dyoriwake.harness.notReadByTests=core/src/main/resources/gradle.properties"]
sources = ["core/src/main/java/io/kestra/core/utils"]
