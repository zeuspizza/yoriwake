# The qualification verdict for this project lives in `bench/qualification.txt`,
# which the harness writes from a real run. It is deliberately NOT repeated here: it was,
# and once seven of these files still claimed NOT QUALIFIED for projects the
# table had passed, with nothing comparing the two.
# HOW TO ADD ONE: bench/README.md, "Adding a project".
# Qualify before sweeping -- that stage is where every defect this
# corpus has found actually turned up, none of them from a sweep:
#     python bench/qualify.py bench/projects/grpc-java.toml
#
# WHY THIS ONE: Large Java, long suites, and real dependency depth between modules -- the cross-module selection
# path that only detekt currently exercises.
#
# KNOWN RISK: Some grpc tests bind loopback sockets. Hermetic on one machine is not hermetic under load; watch
# for flakes, because a flaky suite makes ground truth wrong and manufactures phantom misses.
#
# The module below is a FIRST GUESS. If it hangs, wants a container, or is off the JUnit Platform,
# move to a sibling rather than writing the project off: four projects were written off here and all
# four ran once someone read the actual error.
name = "grpc-java"

# HOW DEEP A SWEEP OF THIS PROJECT GOES, and why this number.
# derived from this project's own observed rate of rows where a miss was possible per
# target: four such rows divided by that ratio.
# `sweep_corpus.py` uses it in place of its own --limit; the value that wrote each row is
# stamped on that row, so a resumed sweep at a different depth cannot make this a lie.
sweep_limit = 16
url = "https://github.com/grpc/grpc-java.git"

# Pinned to a full 40-character SHA. The harness clones ONCE and never re-clones, so a commit
# newer than an existing checkout is simply absent -- which is what blocked micrometer and
# junit5 with "fatal: reference is not a tree". checkout_project now fetches the commit and
# retries before failing.
#
# NOT because the clone is shallow: it is not, `git clone` here passes no --depth. That claim
# was written into eleven of these files and into a commit message before anyone checked it.
commit = "fc4314419dca8dab8383f8687c9be4982dae9054"
# `grpc-core`, not `core`. grpc-java's root project is `grpc` and every subproject carries the
# `grpc-` prefix -- `include ":grpc-core"` in settings.gradle. Named `core` here, qualification
# failed with "project 'core' not found in root project 'grpc'", which reads like a blocked project
# and was a wrong name in this file.
module = "grpc-core"
# The Gradle project is `:grpc-core`; the DIRECTORY is `core`. Same split as micronaut-core, and
# latent here only because this project is blocked for another reason -- without it, the first run
# that gets past that blocker would read results from a directory that does not exist and report a
# suite that ran 1,536 tests as having run none.
module_dir = "core"
# ON THE PLATFORM VIA VINTAGE, because without it nothing here can ever be deselected.
#
# grpc-core runs on JUnit 4's own runner. The agent's filter is a JUnit Platform
# PostDiscoveryFilter, so it is never consulted and every run is a full run however good the map is
# -- measured as 1536/1536 on every one of five mutations, with 0 missed of 28 genuine
# failures. That zero is true by construction: a full run cannot miss anything.
#
# junit-vintage-engine is the JUnit team's own supported path and runs JUnit 4 tests unchanged on
# the Platform. The same script took mockito from 0 visible tests to 2,356.
#
# HONESTY: measured this way, grpc-java is not stock upstream -- its test runtime gained an engine
# and useJUnitPlatform(). Both arms share it, so savings and recall stay comparable, but any claim
# about this project carries "once its tests run on the Platform".
flags = ["-I", "{yoriwake}/scripts/junit-vintage.init.gradle.kts"]
sources = ["core/src/main/java/io/grpc"]

# Set BEFORE the first OOM rather than after it. rxjava's capture died decoding 14,221 tests on the
# default daemon heap and left a map with no scope file, which then forced every later run.
daemon_jvmargs = "-Xmx4g"

# BLOCKED, AND THE BLOCKER IS OURS, NOT GRPC'S.
#
# `:grpc-core:test` dies under this plugin with 261 copies of
#
#     java.lang.ClassNotFoundException:
#       jdk.internal.reflect.GeneratedSerializationConstructorAccessor1
#
# and produces NO test results at all. Three arms on the same checkout settle where it comes from:
#
#     -Pyoriwake.disabled                              1536 tests, 2 pre-existing failures
#     plugin enabled                              crash, 0 test results
#     plugin enabled, includeNoLocationClasses=false   1536 tests, 2 failures, 0 accessor errors
#
# `includeNoLocationClasses` is the Robolectric fix, and this plugin sets it UNCONDITIONALLY.
# It tells JaCoCo to instrument classes it cannot trace to a location on disk -- which is what
# Robolectric's sandbox classes are, and also what the JDK's runtime-generated serialization
# accessors are. Instrumenting those breaks them, and any suite that serializes through reflection
# goes with them.
#
# So the setting that makes Android work breaks serialization-heavy JVM projects, and the two
# requirements are in direct conflict. There is no measurement here that says which is more common.
# The escape hatch would be one property; it is not this file's decision to add one.
#
# grpc-java is otherwise a perfectly good corpus candidate: 1,536 tests in the module, two
# pre-existing failures, and it builds in 14s warm.
