# The qualification verdict for this project lives in `bench/qualification.txt`,
# which the harness writes from a real run. It is deliberately NOT repeated here: it was,
# and seven of these files once still claimed NOT QUALIFIED for projects the
# table had passed, with nothing comparing the two.
# HOW TO ADD ONE: qualify before sweeping -- that stage is where every defect this
# corpus has found actually turned up, none of them from a sweep:
#     python bench/qualify.py bench/projects/spring-boot.toml
#
# WHY THIS ONE: Large, well-factored, and the same AOT order-dependence family that produced this corpus's one
# phantom MISSED. Chosen partly to meet that hazard again deliberately rather than avoid it.
#
# KNOWN RISK: The module path is `core:spring-boot`, NOT `spring-boot-project:spring-boot` -- the repository was
# restructured and the old path is what the first attempt at this file guessed wrong. Verified
# against `include "core:spring-boot"` in settings.gradle at this commit.
#
# The module below is a FIRST GUESS. If it hangs, wants a container, or is off the JUnit Platform,
# move to a sibling rather than writing the project off: four projects were written off here and all
# four ran once someone read the actual error.
name = "spring-boot"

# HOW DEEP A SWEEP OF THIS PROJECT GOES, and why this number.
# derived from this project's own observed rate of rows where a miss was possible per
# target: four such rows divided by that ratio.
# `sweep_corpus.py` uses it in place of its own --limit; the value that wrote each row is
# stamped on that row, so a resumed sweep at a different depth cannot make this a lie.
sweep_limit = 13
url = "https://github.com/spring-projects/spring-boot.git"

# Pinned to a full 40-character SHA. The harness clones ONCE and never re-clones, so a commit
# newer than an existing checkout is simply absent -- which is what blocked micrometer and
# junit5 with "fatal: reference is not a tree". checkout_project now fetches the commit and
# retries before failing.
#
# NOT because the clone is shallow: it is not, `git clone` here passes no --depth. That claim
# was written into eleven of these files and into a commit message before anyone checked it.
commit = "93b23c40c28a331a16530c34189e27781b367aec"
module = "core:spring-boot"
flags = []
# See bench/projects/moshi.toml for what an EMPTY list does and why the harness caught it: the
# mutation grammar finds zero targets and the sweep asks nothing while exiting on a refusal.
#
# The DIRECTORY, which is not the Gradle name. `module` is `core:spring-boot`; the path below is
# where that module's sources actually live.
sources = ["core/spring-boot/src/main/java/org/springframework/boot"]

# Set BEFORE the first OOM rather than after it. rxjava's capture died decoding 14,221 tests on the
# default daemon heap and left a map with no scope file, which then forced every later run.
daemon_jvmargs = "-Xmx4g"

# NEEDS A JDK 25 DAEMON, which is a machine fact and not a property of the project.
# Qualification failed with:
#
#     This project should be built with Java 25 or above
#
# `daemon_java_version` supplies it, found by major version rather than by path, exactly as ktlint
# and spring-framework already do. Do not conclude the project is unusable from the message above.
daemon_java_version = 25
