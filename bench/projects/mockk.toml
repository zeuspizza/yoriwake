# The qualification verdict for this project lives in `bench/qualification.txt`,
# which the harness writes from a real run. It is deliberately NOT repeated here: it was,
# and seven of these files once still claimed NOT QUALIFIED for projects the
# table had passed, with nothing comparing the two.
# HOW TO ADD ONE: qualify before sweeping -- that stage is where every defect this corpus has found
# actually turned up, none of them from a sweep:
#     python bench/qualify.py bench/projects/mockk.toml
#
# ADDED from the candidate screen. Nothing here has been cloned, built, or attached to by
# this plugin; the verdict is whatever `qualify.py` writes into the table, and this file
# deliberately does not guess at it -- twelve files once cached a verdict here and seven of
# them contradicted the table. Four projects were also once written off on the strength of a
# table and all four ran once someone read the actual error. This file is the question.
#
# WHY THIS ONE: Kotlin on the Platform, multiplatform, small. A third sample of the decline path from a
#   different build shape.
#
# KNOWN RISK: mockk's buildSrc once died compiling against Kotlin 2.0 while resolving kotlin-reflect 2.2,
#   which is how this project was written off before. Use the checkout's own wrapper.
#
# The module below is a FIRST GUESS. If it hangs, wants a container, or is off the JUnit
# Platform, move to a sibling rather than writing the project off.
name = "mockk"
url = "https://github.com/mockk/mockk.git"

# Pinned to a full 40-character SHA, which `qualify.py` checks before it clones. Taken from
# the repository's default branch.
commit = "57dd664b470e1873b26636ae44b864fb264df8ab"
# WHY THE TABLE'S RECORDED CAUSE IS NOT THE REAL ONE. Same cause as kotest and okio: a Kotlin Multiplatform
# JVM target without `withJava()`, so the module applies `java-base`, the plugin declines with
# `kotlin-multiplatform`, and nothing is captured. No JVM-only sibling in this build carries tests,
# so the repointing that unblocked kotlinx-coroutines and kotlinx-serialization is not available.
module = "modules:mockk"
# NOT `test`. Asking for a task that does not exist is not a smaller run, it is NO run:
# kotlinx-coroutines compiled for 6m 25s, printed BUILD SUCCESSFUL, exited 0 and ran
# zero tests. A green build that ran nothing is the shape of the silent miss this
# project exists to prevent.
test_task = "jvmTest"
flags = []
# The mutation roots AND the `git log` pathspec. Never empty: an empty pathspec matches
# every commit, which is the opposite of what this key is for, and the replay refuses it.
sources = ["modules/mockk/src/jvmMain/kotlin"]

# Set BEFORE the first OOM rather than after it. rxjava's capture died decoding 14,221
# tests on the default daemon heap and left a map with no scope file, which then forced
# every later run.
daemon_jvmargs = "-Xmx4g"

# ATTACHES AND CAPTURES ITS OWN MODULE. The plugin now attaches to a
# Kotlin Multiplatform module that has a JVM target, and the read-back is the map rather than the
# exit code:
#
#     effective-scope: include  io.mockk.*
#     coverage.tsv:    948 records over 321 distinct io.mockk.* classes
#     qualify:         743 tests in 180.7s wall, 22 modules
#
# ONE include, and it is this module's own package. That is the whole test: an earlier probe
# attached just as successfully and derived THIRTEEN packages, every one belonging to a different
# module, with the measured module's own absent and no coverage recorded at all. The plugin
# withdraws the attach unless the derived scope contains the measured module's own packages, and
# this is what satisfying it looks like.
