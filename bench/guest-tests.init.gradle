/*
 * Harness only: keeps a guest's tests from writing into its own checkout.
 *
 * A file the tests write into the tree while the map is captured is recorded as unknown, and every
 * later selecting run forces on it: the project's preflight stops it as setup-forced and it answers
 * no recall question. Named, with its settings, in the project file's `flags`, so a results file
 * records what its project was measured under:
 *
 *   -Dyoriwake.harness.testClassExcludes=<class-file pattern>,...  test classes left out of every
 *                                                                  run, ground truth too
 *   -Dyoriwake.harness.testSystemProperties=<k>=<v>,...            system properties of every test JVM
 *   -Dyoriwake.harness.notReadByTests=<glob>,...                   yoriwake's `notReadByTests` in
 *                                                                  every project that applies it
 *
 * Classes are left out with the task's `exclude` while each Test task is configured, before
 * yoriwake reads the build script's test filters: a filter pattern added later would make every
 * run a filtered one, and a filtered capture keeps no map. The properties are set when the task
 * graph is ready, after every build script's own `configureEach`, as guest-selection-off.init.gradle
 * does; a system property is not a filter. `notReadByTests` names a file the build writes and no
 * test reads (an npm cache, a report a test framework writes into its working directory), set
 * before yoriwake reads it, as a build script would. It is deprecated, and kept here because its
 * replacement, `pathIgnore`, keeps any `src/` path, and kestra's is one.
 */
def classExcludes = (System.getProperty('yoriwake.harness.testClassExcludes') ?: '')
        .split(',')*.trim().findAll { it }
def testProperties = (System.getProperty('yoriwake.harness.testSystemProperties') ?: '')
        .split(',')*.trim().findAll { it }
def notReadByTests = (System.getProperty('yoriwake.harness.notReadByTests') ?: '')
        .split(',')*.trim().findAll { it }
if (classExcludes) {
    allprojects {
        tasks.withType(Test).configureEach { task -> classExcludes.each { task.exclude(it) } }
    }
}
if (testProperties) {
    gradle.taskGraph.whenReady { graph ->
        graph.allTasks.findAll { it instanceof Test }.each { task ->
            testProperties.each { entry ->
                def (key, value) = entry.split('=', 2) as List
                task.systemProperty(key, value)
            }
        }
    }
}
if (notReadByTests) {
    allprojects { project ->
        project.plugins.whenPluginAdded { plugin ->
            // Not read here: a build yoriwake declines (buildSrc) has no extension, and yoriwake reads
            // the setting once every project is evaluated, after this.
            if (plugin.class.name.startsWith('io.github.zeuspizza.yoriwake.gradle.YoriwakePlugin')) {
                project.afterEvaluate {
                    // `project.`: a bare `extensions` in an init script is the build's, not the project's.
                    project.extensions.findByName('yoriwake')?.notReadByTests?.addAll(notReadByTests)
                }
            }
        }
    }
}
